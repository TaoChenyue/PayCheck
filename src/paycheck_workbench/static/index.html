<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单工作台</title>
<style>
:root {
  --income: #00B578;
  --expense: #1F2329;
  --neutral: #8C8C8C;
  --border: #E5E6EB;
  --page-bg: #F7F8FA;
  --thead-bg: #F5F6F7;
  --row-hover: #F7F9FA;
  --text: #1F2329;
  --text-2: #646A73;
  --danger: #D83931;
}
body[data-source="boc"] { --brand: #C8102E; }
body[data-source="alipay"] { --brand: #1677FF; }
body[data-source="wechat"] { --brand: #07C160; }
body[data-source="total"] { --brand: #7C4DFF; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px; color: var(--text); background: var(--page-bg);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 56px;
  background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#topbar .brand { font-size: 17px; font-weight: 600; white-space: nowrap; }
.topbar-actions { display: flex; gap: 8px; margin-left: auto; }
.btn {
  border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; font-size: 14px; white-space: nowrap;
}
.btn:hover { background: var(--row-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
.btn-primary:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }

/* ---------- 布局 ---------- */
#layout { display: flex; flex: 1; min-height: 0; }

/* ---------- 左侧导航栏（总账户置顶 + 数据源分组 + 筛选区块） ---------- */
#sidenav {
  width: 200px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
  padding: 14px 10px; overflow-y: auto; overflow-x: hidden;  /* 侧栏仅纵向滚动，横向溢出裁剪 */
}
#sidenav-items { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: 12px; color: #C4C7CC; padding: 14px 10px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: none; background: none; border-radius: 8px; padding: 9px 10px; cursor: pointer;
  font-size: 14px; color: var(--text-2); text-align: left;
}
.nav-item:hover { background: var(--row-hover); }
.nav-item.active { background: color-mix(in srgb, var(--brand) 8%, #fff); color: var(--brand); font-weight: 600; }
.nav-item.sub { padding-left: 28px; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #C4C7CC; flex-shrink: 0; }
.nav-item.active .nav-dot { border-color: var(--brand); background: var(--brand); }
.nav-item .badge {
  margin-left: auto; background: color-mix(in srgb, var(--brand) 12%, #fff); color: var(--brand);
  border-radius: 999px; padding: 1px 8px; font-size: 12px; font-variant-numeric: tabular-nums;
}

/* ---------- 左侧导航栏：筛选区块（数据源分组下方） ---------- */
#filter-block {
  margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px; min-width: 0;
}
#filter-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%;
  border: none; background: none; border-radius: 8px; padding: 9px 10px; cursor: pointer;
  font-size: 14px; color: var(--text-2); text-align: left;
}
#filter-toggle:hover { background: var(--row-hover); }
#filter-toggle .filter-caret { width: 10px; font-size: 11px; color: #C4C7CC; flex-shrink: 0; }
#filter-toggle .filter-badge {
  margin-left: auto; min-width: 18px; height: 18px; line-height: 18px;
  border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; text-align: center;
  padding: 0 5px; font-variant-numeric: tabular-nums; flex-shrink: 0;
}
#filter-toggle .filter-badge[hidden] { display: none; }
#filter-panel {
  display: flex; flex-direction: column; gap: 14px; padding: 6px 2px 10px; min-width: 0;
}
#filter-panel[hidden] { display: none; }
.filter-section { min-width: 0; }
.filter-section h3 { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.preset {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 3px 8px;
  font-size: 12px; cursor: pointer; color: var(--text-2);
}
.preset:hover { border-color: var(--brand); color: var(--brand); }
.preset.active { border-color: var(--brand); color: var(--brand); background: color-mix(in srgb, var(--brand) 6%, #fff); }
/* 侧栏宽度有限：字段纵向排列，输入框 min-width:0 可收缩，不产生横向溢出 */
.date-inputs, .amount-inputs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.date-inputs input, .amount-inputs input {
  width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; font-size: 13px; color: var(--text);
}
.date-inputs input:focus, .amount-inputs input:focus { outline: none; border-color: var(--brand); }
.checkbox-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.checkbox-list label {
  display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text);
  padding: 3px 4px; border-radius: 4px; min-width: 0;
}
.checkbox-list label .lbl { min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.filter-note { font-size: 12px; color: #C4C7CC; margin-top: 6px; line-height: 1.5; overflow-wrap: anywhere; }
.checkbox-list label:hover { background: var(--row-hover); }
.checkbox-list input { accent-color: var(--brand); flex-shrink: 0; }
#category-list { max-height: 240px; overflow-y: auto; overflow-x: hidden; }
.filter-actions { display: flex; }
#btn-reset { width: 100%; }

/* ---------- 主区 ---------- */
#main {
  flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 16px 20px; gap: 14px;
  overflow-y: auto;
}
/* 视图标题行 */
#view-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
#view-title h2 { font-size: 18px; font-weight: 600; white-space: nowrap; }
#view-title-desc { font-size: 13px; color: var(--text-2); }
#banners:empty { display: none; }
.banner {
  border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px;
  align-items: flex-start; border: 1px solid;
}
.banner.success { background: #EDFBF4; border-color: #B8ECD5; color: #007A52; }
.banner.error { background: #FEF0EF; border-color: #F6C5C2; color: var(--danger); }
.banner .banner-close { margin-left: auto; cursor: pointer; border: none; background: none; color: inherit; font-size: 14px; }
.banner .expand-link { cursor: pointer; text-decoration: underline; margin-top: 6px; }
.banner ul { margin: 6px 0 0 18px; }
.banner ul li { margin: 2px 0; }

#cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.card {
  background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
}
.card .card-title { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.card .card-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .card-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.card.income .card-value { color: var(--income); }
.card.expense .card-value { color: var(--expense); }
.card.neutral .card-value { color: var(--neutral); }

#toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#search {
  flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px;
  font-size: 13px;
}
#search:focus { outline: none; border-color: var(--brand); }
#pagesize { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
/* 列设置下拉 */
#colset { position: relative; }
#colset-panel {
  position: absolute; top: calc(100% + 4px); right: 0; background: #fff; border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.08); padding: 8px; width: 190px; z-index: 20;
  display: none; max-height: 320px; overflow-y: auto;
}
#colset.open #colset-panel { display: flex; flex-direction: column; gap: 4px; }
#colset-panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; cursor: pointer; border-radius: 4px; }
#colset-panel label:hover { background: var(--row-hover); }
#colset-panel input { accent-color: var(--brand); }

/* ---------- 表格 ---------- */
/* 面板自身为滚动容器（flex:1 + min-height:0 + overflow:auto）：行数多时不再被
   列布局收缩裁切，sticky 表头吸附面板顶部（TCY-27 设计 §5-①） */
#table-wrap { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 10px; flex: 1; min-height: 0; overflow: auto; }
#table-scroll { overflow: visible; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
/* sticky 写在 thead 上而非 th：新版本 Chromium 对表格单元格的 sticky 已失效
   （TCY-27 验收缺陷修复） */
thead { position: sticky; top: 0; z-index: 1; }
thead th {
  background: var(--thead-bg); color: var(--text-2); font-weight: 500; text-align: left;
  padding: 12px 16px; white-space: nowrap; border-bottom: 1px solid var(--border);
  user-select: none;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--text); }
thead th .sort-icon { display: inline-block; width: 14px; font-size: 11px; margin-left: 2px; color: var(--brand); }
tbody td { padding: 12px 16px; border-bottom: 1px solid var(--row-hover); vertical-align: top; }
tbody tr.data-row { cursor: pointer; }
tbody tr.data-row:hover td { background: var(--row-hover); }
tbody tr:last-child td { border-bottom: none; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.ellipsis { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.empty-val { color: #C4C7CC; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap;
}
.tag.income { background: #E8F8F0; color: #007A52; }
.tag.expense { background: #F0F1F3; color: #3A3F46; }
.tag.neutral { background: #F2F3F5; color: var(--neutral); }
.money.income { color: var(--income); }
.money.expense { color: var(--expense); }
.money.neutral { color: var(--neutral); }
.status-badge { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; }
.status-dot.ok { background: var(--income); }
.status-dot.bad { background: var(--danger); }
.status-dot.mid { background: #C4C7CC; }
.copy-btn {
  border: 1px solid var(--border); background: none; border-radius: 4px; cursor: pointer;
  padding: 1px 6px; font-size: 11px; color: var(--text-2); margin-left: 6px; vertical-align: 1px;
}
.copy-btn:hover { color: var(--brand); border-color: var(--brand); }
/* 行展开详情 */
tr.detail-row td { background: #FAFBFC; padding: 14px 20px; cursor: default; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 24px; }
.detail-item .k { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
.detail-item .v { font-size: 13px; word-break: break-all; }

#pagination { display: flex; align-items: center; justify-content: flex-end; gap: 12px; font-size: 13px; color: var(--text-2); }
#pagination button {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer;
}
#pagination button:disabled { opacity: .4; cursor: not-allowed; }

/* 空状态 */
#empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 72px 20px; text-align: center;
}
#empty-state[hidden] { display: none; }  /* hidden 属性优先于 display:flex（有数据时隐藏空态块） */
#empty-state .empty-title { font-size: 16px; font-weight: 600; }
#empty-state .empty-desc { font-size: 13px; color: var(--text-2); line-height: 1.7; }

/* 骨架屏 */
.skeleton-row td { padding: 12px 16px; }
.skeleton-block { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #F0F1F3 25%, #E8E9EC 50%, #F0F1F3 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- 总账户：来源徽标 ---------- */
.src-badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
  color: #fff; font-weight: 600; white-space: nowrap;
}
.src-badge.s-boc { background: #C8102E; }
.src-badge.s-ali { background: #1677FF; }
.src-badge.s-wx { background: #07C160; }
#total-tools { display: flex; align-items: center; gap: 8px; }
#total-tools[hidden] { display: none; }  /* hidden 属性优先于 display:flex（标签管理仅总账户页签可见） */

/* ---------- 总账户：勾选 / 批量操作栏 / 属性 / 标签 ---------- */
th.check-head { width: 40px; }
.row-check { accent-color: var(--brand); cursor: pointer; }
tr.uncounted td { color: #9A9DA3; }                     /* 「不计」行整行置灰 */
tr.uncounted .money.income, tr.uncounted .money.expense { color: #9A9DA3; }
tr.uncounted .tag.income, tr.uncounted .tag.expense { background: #F2F3F5; color: #8C8C8C; }
tr.uncounted .src-badge { opacity: .55; }
td[data-act="toggle-counted"] { cursor: pointer; }
td[data-act="toggle-counted"]:hover { background: var(--row-hover); }
.tag.row-tag { display: inline-flex; align-items: center; gap: 4px; margin-right: 4px; cursor: default; }
.tag.row-tag .chip-x {
  border: none; background: none; cursor: pointer; font-size: 12px; line-height: 1;
  color: inherit; opacity: .7; padding: 0;
}
.tag.row-tag .chip-x:hover { opacity: 1; }
.tag-add {
  border: 1px dashed var(--border); background: none; border-radius: 999px; cursor: pointer;
  padding: 1px 7px; font-size: 12px; color: var(--text-2);
}
.tag-add:hover { color: var(--brand); border-color: var(--brand); }
.tag-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#batch-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: #F5F3FF; border: 1px solid #D9D0FF; border-radius: 8px; padding: 6px 10px; font-size: 13px;
}
#batch-bar[hidden] { display: none; }
#batch-bar .bar-count { font-weight: 600; white-space: nowrap; }
#batch-bar .bar-note { color: var(--text-2); white-space: nowrap; }
#batch-bar .bar-link { border: none; background: none; color: var(--brand); cursor: pointer; text-decoration: underline; padding: 0; font-size: 13px; }
#batch-bar .bar-spacer { margin-left: auto; }
#batch-bar .btn { padding: 4px 12px; font-size: 13px; }

/* ---------- 标签管理 / 打标签弹窗 ---------- */
#tags-modal-mask, #tagpick-modal-mask {
  position: fixed; inset: 0; background: rgba(31, 35, 41, .45); z-index: 120;
  display: flex; align-items: center; justify-content: center;
}
#tags-modal-mask[hidden], #tagpick-modal-mask[hidden] { display: none; }
#tags-modal, #tagpick-modal {
  background: #fff; border-radius: 12px; width: min(560px, 94vw); max-height: 88vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
#tags-modal-header, #tagpick-modal-header {
  display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 600;
}
#tags-modal-header .close, #tagpick-modal-header .close {
  margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-2);
}
#tags-modal-body, #tagpick-modal-body { padding: 20px; }
.tm-create, .tp-create { display: flex; gap: 8px; margin-bottom: 14px; }
.tm-create input, .tp-create input {
  flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px;
}
.tm-create input:focus, .tp-create input:focus { outline: none; border-color: var(--brand); }
.tm-list, .tp-list { display: flex; flex-direction: column; gap: 8px; }
.tm-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.tm-item .tm-name { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
.tm-item .tm-name:hover, .tm-item .tm-name:focus { border-color: var(--border); outline: none; }
.tm-item .tm-count { font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tm-item .btn { padding: 3px 10px; font-size: 12px; }
.tm-item .btn.danger:hover { color: var(--danger); border-color: var(--danger); }
.tp-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
  cursor: pointer; font-size: 13px;
}
.tp-item:hover { background: var(--row-hover); }
.tp-item input { accent-color: var(--brand); }
.tm-empty { color: #C4C7CC; text-align: center; padding: 16px 0; font-size: 13px; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

/* ---------- 导入弹窗 ---------- */
#modal-mask {
  position: fixed; inset: 0; background: rgba(31, 35, 41, .45); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
#modal-mask[hidden] { display: none; }
#modal {
  background: #fff; border-radius: 12px; width: min(760px, 92vw); max-height: 88vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
#modal-header {
  display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 600;
}
#modal-header .close { margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-2); }
#modal-body { padding: 20px; }
#dropzone {
  border: 2px dashed var(--border); border-radius: 10px; padding: 48px 20px; text-align: center;
  cursor: pointer; color: var(--text-2); transition: border-color .15s;
}
#dropzone:hover, #dropzone.dragover { border-color: var(--brand); color: var(--brand); }
#dropzone .dz-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
#dropzone .dz-desc { font-size: 12px; margin-top: 4px; }
#modal-error {
  background: #FEF0EF; border: 1px solid #F6C5C2; color: var(--danger); border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none;
}
.modal-warn {
  background: #FFF9E6; border: 1px solid #F2DEB3; color: #8A6D1F; border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; word-break: break-all;
}
/* 批量导入：逐文件可展开卡片 / 进度列表 / 确定进度条 */
.sample-table-wrap th.num { text-align: right; }
tr.bf-error td { color: var(--danger); }
.bf-new { color: var(--income); font-weight: 600; }
.bf-fail { color: var(--danger); font-weight: 600; }
.file-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; background: #fff; }
.file-card.error { border-color: #F6C5C2; background: #FEF0EF; }
.file-card-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
  font-size: 13px; user-select: none;
}
.file-card-head:hover { background: var(--row-hover); }
.file-card .fc-toggle { width: 14px; color: var(--text-2); flex-shrink: 0; }
.file-card .fc-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-card .fc-summary { color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.file-card.error .fc-summary { color: var(--danger); }
.fc-remove {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer;
  padding: 2px 8px; font-size: 12px; color: var(--text-2); flex-shrink: 0;
}
.fc-remove:hover { color: var(--danger); border-color: var(--danger); }
.file-card-body { padding: 10px 14px 14px; border-top: 1px solid var(--border); }
.file-card-body h5 { font-size: 12px; color: var(--text-2); margin: 6px 0; font-weight: 600; }
.batch-merged-extra { font-size: 13px; color: var(--text-2); margin-top: 10px; line-height: 1.8; }
.batch-file-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.batch-file-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px;
}
.batch-file-item .bf-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-file-item .bf-status { color: var(--text-2); white-space: nowrap; }
.batch-file-item.active { border-color: var(--brand); }
.batch-file-item.active .bf-status { color: var(--brand); }
.batch-file-item.done .bf-status { color: var(--income); }
.batch-file-item.fail { border-color: #F6C5C2; background: #FEF0EF; }
.batch-file-item.fail .bf-status { color: var(--danger); }
.progress-bar .fill.determinate { width: 0%; animation: none; transition: width .25s; }
.preview-block { margin-bottom: 18px; }
.preview-block h4 { font-size: 13px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
.preview-file { font-size: 14px; font-weight: 600; margin-bottom: 12px; word-break: break-all; }
.preview-stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat {
  background: var(--page-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  min-width: 110px;
}
.stat .s-label { font-size: 12px; color: var(--text-2); }
.stat .s-value { font-size: 15px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat.new .s-value { color: var(--income); }
.stat.dup .s-value { color: var(--neutral); }
.stat.err .s-value { color: var(--danger); }
.sample-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.sample-table-wrap table { font-size: 12px; }
.sample-table-wrap thead th { padding: 8px 10px; }
.sample-table-wrap td { padding: 8px 10px; white-space: nowrap; }
#modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.progress-bar { height: 8px; border-radius: 4px; background: var(--page-bg); overflow: hidden; margin-top: 14px; }
.progress-bar .fill { height: 100%; width: 40%; background: var(--brand); border-radius: 4px; animation: slide 1s infinite linear; }
@keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }

/* ---------- PDF 转换弹窗（与导入弹窗互斥打开） ---------- */
#convert-mask {
  position: fixed; inset: 0; background: rgba(31, 35, 41, .45); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
#convert-mask[hidden] { display: none; }
#convert-modal {
  background: #fff; border-radius: 12px; width: min(760px, 92vw); max-height: 88vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
#convert-header {
  display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 600;
}
#convert-header .close { margin-left: auto; border: none; background: none; font-size: 16px; cursor: pointer; color: var(--text-2); }
#convert-body { padding: 20px; }
#convert-dropzone {
  border: 2px dashed var(--border); border-radius: 10px; padding: 32px 20px; text-align: center;
  cursor: pointer; color: var(--text-2); transition: border-color .15s;
}
#convert-dropzone:hover, #convert-dropzone.dragover { border-color: var(--brand); color: var(--brand); }
#convert-dropzone .dz-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
#convert-dropzone .dz-desc { font-size: 12px; margin-top: 4px; }
#convert-dropzone .btn { margin: 8px 4px 0; }
#convert-error {
  background: #FEF0EF; border: 1px solid #F6C5C2; color: var(--danger); border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none;
}
/* 顶栏「转换中」胶囊指示（仅 BOC 页签） */
#convert-pill {
  display: inline-flex; align-items: center; gap: 6px; background: var(--brand); color: #fff;
  border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
#convert-pill[hidden] { display: none; }
/* 转换弹窗：已选文件 / 高级选项 */
.conv-conflict { color: var(--neutral); }
.conv-link { color: var(--brand); text-decoration: underline; cursor: pointer; }
.conv-advanced { margin: 14px 0; border-top: 1px solid var(--border); padding-top: 10px; }
.conv-advanced-toggle { border: none; background: none; color: var(--text-2); cursor: pointer; padding: 4px 0; font-size: 13px; }
.conv-advanced-toggle:hover { color: var(--brand); }
.conv-param { margin: 10px 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.conv-param > .conv-param-label { color: var(--text-2); min-width: 70px; }
.conv-param label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.conv-param input[type="radio"], .conv-param input[type="checkbox"] { accent-color: var(--brand); }
.conv-param input[type="number"] { width: 70px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
#convert-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
#convert-actions .conv-spacer { margin-right: auto; }
</style>
</head>
<body data-source="total">
<header id="topbar">

  <div class="topbar-actions">
    <span id="convert-pill" hidden></span>

<div id="layout">
  <aside id="sidenav">
    <nav id="sidenav-items"></nav>
    <div id="filter-block">
      <button type="button" id="filter-toggle">
        <span class="filter-caret" id="filter-caret">▾</span>
        <span>筛选</span>
        <span class="filter-badge" id="filter-badge" hidden></span>
      </button>
      <div id="filter-panel">
        <div class="filter-section">
          <h3>日期范围</h3>
          <div class="presets" id="presets">
            <button class="preset" data-preset="this-month">本月</button>
            <button class="preset" data-preset="last-month">上月</button>
            <button class="preset" data-preset="recent-3m">近3月</button>
            <button class="preset" data-preset="custom">自定义</button>
          </div>
          <div class="date-inputs">
            <input type="date" id="date-from" title="开始日期">
            <input type="date" id="date-to" title="结束日期">
          </div>
        </div>
        <div class="filter-section">
          <h3>收/支</h3>
          <div class="checkbox-list" id="direction-list"></div>
        </div>
        <div class="filter-section" id="counted-section" hidden>
          <h3>属性</h3>
          <div class="checkbox-list" id="counted-list"></div>
          <div class="filter-note">不计行已整行置灰；仅计入收支的账单参与汇总</div>

        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C4C7CC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>
        </svg>
        <div class="empty-title">暂无账单数据</div>

        <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
          <button class="btn btn-primary" id="btn-import-empty">导入账单</button>

</div>

<div id="modal-mask" hidden>

<script>
"use strict";
/* ================= 状态 ================= */
const SOURCE_LABELS = {};   // 由 /api/meta 填充
const ACCEPT = { boc: ".csv", alipay: ".csv", wechat: ".xlsx,.csv" };
const FORMAT_DESC = {
  boc: "BOC CSV（boc-pdf2csv 输出，UTF-8）",
  alipay: "支付宝网页版导出 CSV（GBK）",
  wechat: "微信支付账单 XLSX（兼容 CSV）",
};

let currentSource = "total";
let meta = { counts: {} };
let optionsCache = {};          // source -> options
let filtersBySource = {};       // source -> 筛选状态
let sortBySource = {};          // source -> {key, order}  order: 'asc'|'desc'|null
let visibleColsBySource = {};   // source -> Set(逻辑列 key)
let pageBySource = {};
let pageSizeBySource = {};
let expandedRow = null;         // 当前展开的明细 id
let modalSource = null;         // 弹窗打开时的数据源
let modalFile = null;           // 已选文件（单文件流程）
let modalFiles = null;          // 批量模式的有效文件列表
let modalWarn = null;           // 类型不符/同名被跳过的文件提示
let batchImporting = false;     // 批量写入进行中（禁止关闭弹窗）
let selectedRows = new Set(); // 总账户勾选的行 id（当前页范围）
let selectAllFiltered = false; // 全量模式：批量操作作用于整个筛选结果
let tagsCache = [];           // 标签组列表（总账户筛选面板/弹窗共用）
let filterPanelOpen = true;   // 筛选区块折叠态（会话内记住，不落库）
let convertJobId = null;      // 当前/最近一次 PDF 转换任务 id（供预览/确认接口使用）
let convertJob = null;        // 最近一次任务快照（进度/结果视图数据源）
let convertPollTimer = null;  // 进度轮询定时器
let convertSelected = [];     // 阶段一已选 PDF 文件列表
let convertWarn = null;       // 选择阶段的警告文本（非 PDF / 同名忽略）
let convertInterrupted = false; // 服务重启导致任务丢失（打开弹窗时提示一次）
let convertResultSeen = false;  // 结果视图已展示过；未看过的结束态任务在关闭弹窗后保留，重开直达结果视图
let convertParams = { scale: "3.0", device: "auto", timeout: 60, force: false }; // 高级选项输入

const TOTAL = "total";
const TAB_ORDER = [TOTAL, "boc", "alipay", "wechat"];
const SRC_BADGE_CLS = { boc: "s-boc", alipay: "s-ali", wechat: "s-wx" };
const TOTAL_LABEL = "总账户";

function freshFilters() {
  return { q: "", date_from: "", date_to: "", directions: [], categories: [],
           amount_min: "", amount_max: "", sources: ["boc", "alipay", "wechat"],
           counted: ["1", "0"], tags: [] };  // 属性两档默认全选
}
for (const s of TAB_ORDER) {
  filtersBySource[s] = freshFilters();
  sortBySource[s] = { key: "datetime", order: "desc" };
  pageBySource[s] = 1;
  pageSizeBySource[s] = 50;
}

/* ================= 工具 ================= */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function fmtMoney(v) {
  if (v === "" || v === null || v === undefined) return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  return n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function dirInfo(row) {
  const d = row[optionsCache[currentSource].direction_col] || "";
  if (d === "收入") return { cls: "income", sign: "+", label: "收入" };
  if (d === "支出") return { cls: "expense", sign: "−", label: "支出" };
  return { cls: "neutral", sign: "", label: d || "—" };
}
function moneyHtml(row) {
  const o = optionsCache[currentSource];
  const d = dirInfo(row);
  const v = row[o.amount_col];
  if (v === "" || v === null || v === undefined) return '<span class="empty-val">—</span>';
  return `<span class="money ${d.cls}">${d.sign}${fmtMoney(v)}</span>`;
}
function statusHtml(v) {
  if (!v) return '<span class="empty-val">—</span>';
  let cls = "mid";
  if (v.includes("成功")) cls = "ok";
  else if (v.includes("失败") || v.includes("关闭") || v.includes("退")) cls = "bad";
  return `<span class="status-badge"><span class="status-dot ${cls}"></span>${esc(v)}</span>`;
}
function dirTagHtml(row) {
  const d = dirInfo(row);
  if (d.label === "—") return '<span class="empty-val">—</span>';
  return `<span class="tag ${d.cls}">${esc(d.label)}</span>`;
}
function srcBadgeHtml(source) {
  return `<span class="src-badge ${SRC_BADGE_CLS[source] || ""}">${esc(SOURCE_LABELS[source] || source)}</span>`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
}
function api(path, opts) {
  return fetch(path, opts).then((r) => r.json().catch(() => ({ ok: false, error: "响应解析失败" })));
}
function extOk(name) {
  const dot = name.lastIndexOf(".");
  const ext = dot >= 0 ? name.slice(dot).toLowerCase() : "";
  return ACCEPT[modalSource].split(",").map((s) => s.trim()).includes(ext);
}

/* ================= 数据加载 ================= */
async function loadMeta() {
  const res = await api("/api/meta");
  if (!res.ok) throw new Error(res.error || "获取元信息失败");
  meta = res;
  for (const s of res.sources) SOURCE_LABELS[s.name] = s.label;
}
async function loadOptions(source, force) {
  if (!force && optionsCache[source]) return optionsCache[source];
  const res = await api("/api/options?source=" + encodeURIComponent(source));
  if (!res.ok) throw new Error(res.error || "获取列信息失败");
  optionsCache[source] = res;
  if (!visibleColsBySource[source]) {
    visibleColsBySource[source] = new Set(res.columns.filter((c) => c.visible).map((c) => c.key));
  }
  return res;
}
function filterQuery() {
  const f = filtersBySource[currentSource];
  const p = new URLSearchParams();
  p.set("source", currentSource);
  if (f.q) p.set("q", f.q);
  if (f.date_from) p.set("date_from", f.date_from);
  if (f.date_to) p.set("date_to", f.date_to);
  if (f.directions.length) p.set("directions", f.directions.join(","));
  if (currentSource === TOTAL) {
    if (f.sources.length) p.set("sources", f.sources.join(","));
    // 属性：两档全选不发参数（不过滤）；勾一档发 1/0；全不勾发空值（匹配 0 行）
    if (f.counted.length === 1) p.set("counted", f.counted[0]);
    else if (f.counted.length === 0) p.set("counted", "");
    if (f.tags.length) p.set("tags", f.tags.join(","));
  } else if (f.categories.length) {
    p.set("categories", f.categories.join(","));
  }
  if (f.amount_min !== "") p.set("amount_min", f.amount_min);
  if (f.amount_max !== "") p.set("amount_max", f.amount_max);
  return p;
}
async function loadRows() {
  clearSelection(false);
  const p = filterQuery();
  p.set("page", pageBySource[currentSource]);
  p.set("page_size", pageSizeBySource[currentSource]);
  const s = sortBySource[currentSource];
  if (s.order) { p.set("sort", s.key); p.set("order", s.order); }
  showSkeleton();
  const res = await api("/api/rows?" + p.toString());
  if (!res.ok) throw new Error(res.error || "查询失败");
  renderTable(res);
}
async function loadSummary() {
  const p = filterQuery();
  const res = await api("/api/summary?" + p.toString());
  if (!res.ok) throw new Error(res.error || "汇总失败");
  renderCards(res);
}
async function refreshAll() {
  try {
    await Promise.all([loadMeta(), loadOptions(currentSource, true)]);
    if (currentSource === TOTAL) await loadTags();
    renderNav(); renderFilterPanel(); renderToolbar();
    await Promise.all([loadRows(), loadSummary()]);
  } catch (e) { showErrorBanner(e.message); }
}

/* ================= 渲染 ================= */
function renderNav() {
  // 左侧导航栏：总账户为一级主视图（置顶、默认选中），数据源三源为二级分组（保留笔数徽标）
  const nav = $("#sidenav-items");
  const totalCount = (meta.counts.boc ?? 0) + (meta.counts.alipay ?? 0) + (meta.counts.wechat ?? 0);
  const item = (s, label, count, sub) =>
    `<button class="nav-item${sub ? " sub" : ""}${s === currentSource ? " active" : ""}" data-source="${s}">
       <span class="nav-dot"></span><span>${esc(label)}</span>
       <span class="badge">${count.toLocaleString()}</span></button>`;
  nav.innerHTML = item(TOTAL, TOTAL_LABEL, totalCount, false)
    + '<div class="nav-group">数据源</div>'
    + TAB_ORDER.filter((s) => s !== TOTAL)
        .map((s) => item(s, SOURCE_LABELS[s] || s, meta.counts[s] ?? 0, true)).join("");
  nav.querySelectorAll(".nav-item").forEach((b) =>
    b.addEventListener("click", () => switchTab(b.dataset.source)));
  document.body.dataset.source = currentSource;
  renderViewTitle();
  // 顶栏「导入账单」仅数据源视图可见（总账户导入入口由空态引导）；「转换 PDF」与转换胶囊仅 BOC 页签
  $("#btn-import").hidden = currentSource === TOTAL;
  $("#btn-convert").hidden = currentSource !== "boc";
  updateConvertPill(convertJob);
}
function renderViewTitle() {
  // 主区顶部视图标题行（视图名 + 一句说明）
  if (currentSource === TOTAL) {
    $("#view-title-name").textContent = TOTAL_LABEL;
    $("#view-title-desc").textContent = "三源合并视图，在这里标记收支与标签";
  } else {
    $("#view-title-name").textContent = SOURCE_LABELS[currentSource] || currentSource;
    $("#view-title-desc").textContent = "原始账单，导入与查看；收支与标签管理请到总账户";
  }
}
function renderFilterPanel() {
  // 筛选面板字段与原侧栏一一对应（逻辑平移，功能零回归）
  const o = optionsCache[currentSource];
  const f = filtersBySource[currentSource];
  $("#category-title").textContent = o.category_label || "分类";
  // 收/支
  $("#direction-list").innerHTML = o.directions.map((d) =>
    `<label><input type="checkbox" value="${esc(d)}" ${f.directions.includes(d) ? "checked" : ""}> <span class="lbl">${esc(d)}</span></label>`
  ).join("");
  $("#direction-list").querySelectorAll("input").forEach((el) =>
    el.addEventListener("change", () => {
      f.directions = [...$("#direction-list").querySelectorAll("input:checked")].map((i) => i.value);
      onFilterChange();
    }));
  // 总账户专属区块：属性 / 标签（其余页签隐藏）
  $("#counted-section").hidden = currentSource !== TOTAL;
  $("#tags-section").hidden = currentSource !== TOTAL;
  if (currentSource === TOTAL) {
    $("#counted-list").innerHTML = [["1", "计入"], ["0", "不计"]].map(([v, label]) =>
      `<label><input type="checkbox" value="${v}" ${f.counted.includes(v) ? "checked" : ""}> <span class="lbl">${esc(label)}</span></label>`
    ).join("");
    $("#counted-list").querySelectorAll("input").forEach((el) =>
      el.addEventListener("change", () => {

function activeFilterCount() {

function cycleSort(sortKey) {

  else if (s.order === "desc") { s.order = "asc"; }
  else if (s.order === "asc") { s.order = null; }
  else { s.order = "desc"; }
  pageBySource[currentSource] = 1;
  renderTableHead();
  loadRows();

function cellHtml(row, col) {
  const o = optionsCache[currentSource];
  const v = row[col.key];
  if (col.kind === "checkbox") {
    return `<input type="checkbox" class="row-check" data-id="${esc(row.id)}">`;
  }
  if (col.kind === "datetime") {
    let text = v || "";
    if (col.key === "datetime" && o.time_col) {
      text = [row[o.date_col], row[o.time_col]].filter(Boolean).join(" ");
    }
    if (!text) return '<span class="empty-val">—</span>';
    return esc(text);
  }
  if (col.kind === "direction") return dirTagHtml(row);
  if (col.kind === "amount") return moneyHtml(row);
  if (col.kind === "source") return srcBadgeHtml(row.source);
  if (col.kind === "counted") return countedHtml(row);
  if (col.kind === "tags") return tagsHtml(row);
  if (col.kind === "balance") return v ? `<span class="num">${fmtMoney(v)}</span>` : '<span class="empty-val">—</span>';
  if (col.kind === "status") return statusHtml(v);
  if (col.kind === "copy") {
    if (!v) return '<span class="empty-val">—</span>';
    return `<span class="num">${esc(v)}</span><button class="copy-btn" data-copy="${esc(v)}">复制</button>`;
  }
  if (!v) return '<span class="empty-val">—</span>';
  // 微信「支付方式」在中性交易行可能为 /，按设计显示为 —
  const display = col.key === "支付方式" && v === "/" ? "—" : v;
  return `<span title="${esc(v)}">${esc(display)}</span>`;
}

async function setCounted(scope, counted, silent) {
  const res = await api("/api/total/overrides", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...scope, counted }),
  });
  if (!res.ok) { showErrorBanner(res.error || "操作失败"); return false; }
  if (!silent) addBanner("success", `已将 ${res.updated.toLocaleString()} 条设为${counted ? "计入" : "不计"}`, null);
  await refreshRowsAndSummary();
  return true;
}
async function refreshRowsAndSummary() {

}
function bindTotalRowEvents() {

  document.querySelectorAll("#table-body .row-check").forEach((cb) =>
    cb.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (cb.checked) selectedRows.add(cb.dataset.id); else selectedRows.delete(cb.dataset.id);
      renderBatchBar(lastRows);
    }));
  // 属性列点击切换计入↔不计（单行快速修改，即时保存）
  document.querySelectorAll('#table-body td[data-act="toggle-counted"]').forEach((td) =>
    td.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      const tr = td.closest("tr");
      const row = (lastRows ? lastRows.rows : []).find((r) => String(r.id) === String(tr.dataset.id));
      if (!row) return;
      await setCounted({ scope: "ids", ids: [row.id] }, row.counted ? 0 : 1, true);
    }));
  // 标签列：「+」打标签（同一弹层，单行 scope）
  document.querySelectorAll('[data-act="tag-add"]').forEach((btn) =>
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      openTagPick({ scope: "ids", ids: [btn.closest("tr").dataset.id] });
    }));
  // chip × 移除单行标签
  document.querySelectorAll('[data-act="tag-remove"]').forEach((btn) =>
    btn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      const id = btn.closest("tr").dataset.id;
      const res = await api("/api/tags/apply", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scope: "ids", action: "remove", group_ids: [Number(btn.dataset.tag)], ids: [id] }),
      });
      if (!res.ok) { showErrorBanner(res.error || "移除标签失败"); return; }
      await refreshRowsAndSummary();
    }));
}
function toggleDetail(id) {

function addBanner(type, message, failures) {

  if (failures && failures.length) {

  inner += `<button class="banner-close" data-act="close">×</button>`;

async function switchTab(source) {
  if (source === currentSource) return;
  currentSource = source;
  document.body.dataset.source = source;
  renderNav();
  try {
    await loadOptions(source, false);
    if (source === TOTAL) {
      // 总账户行详情展开依赖各源列信息；筛选面板标签区块依赖标签列表
      await Promise.all(["boc", "alipay", "wechat"].map((s) => loadOptions(s, false)));
      await loadTags();
    }
    renderFilterPanel(); renderToolbar();
    await Promise.all([loadRows(), loadSummary()]);
  } catch (e) { showErrorBanner(e.message); }
}
const onFilterChange = debounce(() => {
  pageBySource[currentSource] = 1;
  updatePresetActive();
  updateFilterBadge();
  loadRows().then(loadSummary).catch((e) => showErrorBanner(e.message));
}, 300);
function updatePresetActive() {
  const f = filtersBySource[currentSource];
  const presets = ["this-month", "last-month", "recent-3m"];
  const matched = presets.some((p) => {
    const [from, to] = presetRange(p);
    return from === f.date_from && to === f.date_to;
  });
  document.querySelectorAll("#presets .preset").forEach((b) => {
    const p = b.dataset.preset;
    const [from, to] = presetRange(p);
    const active = p === "custom"
      ? !matched && (f.date_from !== "" || f.date_to !== "")
      : from === f.date_from && to === f.date_to;
    b.classList.toggle("active", active);
  });
}
function presetRange(preset) {
  const now = new Date();
  const fmt = (d) => {
    const p2 = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  };
  const firstOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  if (preset === "this-month") return [fmt(firstOfMonth(now)), fmt(now)];
  if (preset === "last-month") {
    const m = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return [fmt(m), fmt(new Date(now.getFullYear(), now.getMonth(), 0))];
  }
  if (preset === "recent-3m") {
    const d = new Date(now.getFullYear(), now.getMonth() - 2, 1);
    return [fmt(d), fmt(now)];
  }
  return ["", ""];
}
function applyPreset(preset) {
  if (preset === "custom") {
    $("#date-from").focus();
    return;
  }
  const f = filtersBySource[currentSource];
  const [from, to] = presetRange(preset);
  f.date_from = from; f.date_to = to;
  $("#date-from").value = from; $("#date-to").value = to;
  updatePresetActive();
  onFilterChange();
}
function resetFilters() {
  filtersBySource[currentSource] = freshFilters();
  renderFilterPanel();
  pageBySource[currentSource] = 1;
  loadRows().then(loadSummary).catch((e) => showErrorBanner(e.message));
}

function openModal() {

}
function closeModal() {
  if (batchImporting) return;  // 批量写入进行中，防误关
  $("#modal-mask").hidden = true;
  modalFile = null;
  modalFiles = null;
  modalWarn = null;
}
function renderModalSelect() {
  const body = $("#modal-body");
  // BOC 导入弹窗顺带引流：对账单是 PDF？去转换（设计 §5.1）
  const pdfHint = modalSource === "boc"
    ? `<div class="dz-desc"><a class="conv-link" id="dz-go-convert" href="javascript:void(0)">对账单是 PDF？去转换</a></div>` : "";
  body.innerHTML = `
    <div id="dropzone">
      <div class="dz-title">点击选择或拖拽文件到此处（可多选）</div>
      <div>支持格式：${esc(FORMAT_DESC[modalSource])}</div>
      <div class="dz-desc">导入前会先解析预览并做去重比对，确认后才写入数据库</div>
      ${pdfHint}
    </div>
    <input type="file" id="file-input" accept="${ACCEPT[modalSource]}" multiple hidden>`;
  const dz = $("#dropzone");
  const input = $("#file-input");
  dz.addEventListener("click", () => input.click());
  input.addEventListener("change", () => { if (input.files.length) handleFiles([...input.files]); });
  ["dragover", "dragenter"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("dragover"); }));
  dz.addEventListener("drop", (e) => {
    const files = e.dataTransfer.files && [...e.dataTransfer.files];
    if (files && files.length) handleFiles(files);
  });
  const goConvert = body.querySelector("#dz-go-convert");
  if (goConvert) goConvert.addEventListener("click", () => { closeModal(); openConvertModal(); });
}
function handleFiles(files) {
  // 同一次选择中同名文件忽略并提示（设计 §3.3 建议项）；按当前 Tab 限定类型，不匹配的明确提示且不写入
  const seenNames = new Set();
  const dupNames = [];
  const unique = files.filter((f) => {
    if (seenNames.has(f.name)) { dupNames.push(f.name); return false; }
    seenNames.add(f.name);
    return true;
  });
  const valid = unique.filter((f) => extOk(f.name));
  const invalid = unique.filter((f) => !extOk(f.name));
  const notices = [];
  if (invalid.length) notices.push(`以下 ${invalid.length} 个文件类型与当前数据源不符，已跳过不导入：${invalid.map((f) => f.name).join("、")}`);
  if (dupNames.length) notices.push(`同一次选择中的 ${dupNames.length} 个同名文件已忽略：${dupNames.join("、")}`);
  modalWarn = notices.length ? notices.join("；") : null;
  if (!valid.length) {
    renderModalSelect();
    modalError(modalWarn);
    return;
  }
  if (valid.length === 1) {
    handleFile(valid[0]);
    return;
  }
  modalFiles = valid;
  previewBatch(valid);
}
function modalError(msg) {
  let el = $("#modal-error");
  if (!el) { el = document.createElement("div"); el.id = "modal-error"; $("#modal-body").prepend(el); }
  el.textContent = msg;
  el.style.display = "block";
}
async function handleFile(file) {
  modalFile = file;

  try {
    const res = await upload("/api/import/preview", file);
    if (!res.ok) { renderModalSelect(); modalError(res.error || "解析失败"); return; }
    renderModalPreview(res);
  } catch (e) {
    renderModalSelect();
    modalError("网络错误：" + e.message);
  }
}
function upload(path, file) {
  return fetch(path, {
    method: "POST",
    body: file,
    headers: {
      "Content-Type": "application/octet-stream",
      "X-Source": modalSource,
      "X-Filename": encodeURIComponent(file.name),

}
function uploadBatch(path, files) {
  const fd = new FormData();
  for (const f of files) fd.append("files", f, f.name);
  return fetch(path, {
    method: "POST",
    body: fd,
    headers: { "X-Source": modalSource },  // Content-Type 由浏览器带 boundary 自动设置

/* ---- 批量导入：预览 → 逐文件写入（进度）→ 结果 ---- */
function buildBatchModel(res, files) {
  // 服务端逐文件响应 → 客户端模型：columns 顶层共享，卡片展开态随模型保存
  return {
    source: res.source,
    columns: res.columns || [],
    expanded: new Set(res.files.length === 1 ? [res.files[0].file_name] : []),  // 单文件默认展开
    items: res.files.map((f, i) => ({
      file: files[i],
      name: f.file_name,
      error: f.error || null,
      removed: false,
      stats: f.error ? null : {
        row_count: f.row_count,
        error_count: f.error_count,
        invalid_count: f.invalid_count,
        new_count: f.new_count,
        dup_count: f.dup_count,
        date_min: f.date_min,
        date_max: f.date_max,
        distribution: f.distribution || [],
        sample: f.sample || [],
      },
    })),
  };
}
function batchTotals(model) {
  // 移除后合并统计即时重算：仅统计未移除且解析成功的文件
  const active = model.items.filter((f) => !f.removed && !f.error);
  const totals = {
    active_count: model.items.filter((f) => !f.removed).length,
    row_count: 0, new_count: 0, dup_count: 0, failed_count: 0,
    date_min: "", date_max: "", distribution: [],
  };
  const distAcc = {};
  const order = [];
  for (const f of active) {
    const s = f.stats;
    totals.row_count += s.row_count;
    totals.new_count += s.new_count;
    totals.dup_count += s.dup_count;
    totals.failed_count += s.error_count + s.invalid_count;
    if (s.date_min && (!totals.date_min || s.date_min < totals.date_min)) totals.date_min = s.date_min;
    if (s.date_max && (!totals.date_max || s.date_max > totals.date_max)) totals.date_max = s.date_max;
    for (const d of s.distribution) {
      if (!order.includes(d.label)) order.push(d.label);
      const acc = distAcc[d.label] || (distAcc[d.label] = { count: 0, sum: 0 });
      acc.count += d.count;
      acc.sum += d.sum;
    }
  }
  totals.distribution = order.map((l) => ({ label: l, count: distAcc[l].count, sum: Math.round(distAcc[l].sum * 100) / 100 }));
  return totals;
}

async function confirmBatchImport(model) {
  // 逐文件调用单文件 confirm 接口（幂等键不变，批内重复由库内已见键自然拦截）；
  // 已移除与预览解析失败的文件不上传（解析失败的直接在结果中标记）
  const plan = model.items.filter((f) => !f.removed).map((f) => ({ file: f.file, error: f.error || null }));
  batchImporting = true;
  renderBatchProgress(plan);
  const results = [];
  for (let i = 0; i < plan.length; i++) {
    const { file, error } = plan[i];
    if (error) {
      results.push({ file_name: file.name, error, inserted: 0, skipped: 0, failed: 0, failures: [] });
      setBatchItemState(i, "fail", `解析失败：${error}`);
    } else {
      setBatchItemState(i, "active", "写入中…");
      try {
        const res = await upload("/api/import/confirm", file);
        if (!res.ok) {
          results.push({ file_name: file.name, error: res.error || "导入失败", inserted: 0, skipped: 0, failed: 0, failures: [] });
          setBatchItemState(i, "fail", res.error || "导入失败");
        } else {
          results.push({ file_name: file.name, error: null, ...res });
          setBatchItemState(i, "done", `新增 ${res.inserted.toLocaleString()} · 跳过 ${res.skipped.toLocaleString()} · 失败 ${res.failed}`);
        }
      } catch (e) {
        results.push({ file_name: file.name, error: "网络错误：" + e.message, inserted: 0, skipped: 0, failed: 0, failures: [] });
        setBatchItemState(i, "fail", "网络错误：" + e.message);
      }
    }
    setBatchProgress(i + 1, plan.length);
  }
  batchImporting = false;
  renderBatchDone(results);
}
function renderBatchProgress(plan) {
  $("#modal-body").innerHTML = `
    <div class="preview-file">正在导入（0/${plan.length}）</div>
    <div class="batch-file-list">${plan.map((p, i) => `
      <div class="batch-file-item" data-i="${i}">
        <span class="bf-name">${esc(p.file.name)}</span>

    <div style="font-size:12px;color:#646A73;margin-top:8px">请勿关闭窗口，正在逐文件写入</div>`;
}
function setBatchItemState(i, state, text) {
  const el = document.querySelector(`.batch-file-item[data-i="${i}"]`);
  if (!el) return;
  el.className = `batch-file-item ${state}`;
  el.querySelector(".bf-status").textContent = text;

function setBatchProgress(done, total) {
  const fill = $("#batch-progress-fill");
  if (fill) fill.style.width = `${Math.round((done / total) * 100)}%`;
  const title = $("#modal-body .preview-file");
  if (title) title.textContent = `正在导入（${done}/${total}）`;
}
function renderBatchDone(results) {
  const agg = results.reduce((a, r) => ({
    inserted: a.inserted + (r.inserted || 0),
    skipped: a.skipped + (r.skipped || 0),
    failed: a.failed + (r.failed || 0),
    fileErrors: a.fileErrors + (r.error ? 1 : 0),
  }), { inserted: 0, skipped: 0, failed: 0, fileErrors: 0 });
  const rows = results.map((r) => {
    if (r.error) return `<tr class="bf-error"><td>${esc(r.file_name)}</td><td>导入失败：${esc(r.error)}</td></tr>`;
    return `<tr><td>${esc(r.file_name)}</td><td class="num">新增 <span class="bf-new">${r.inserted.toLocaleString()}</span> · 跳过 ${r.skipped.toLocaleString()}${r.failed ? ` · <span class="bf-fail">失败 ${r.failed}</span>` : ""}</td></tr>`;
  }).join("");
  $("#modal-body").innerHTML = `
    <div class="preview-file">导入完成</div>
    <div class="preview-block">
      <h4>逐文件结果</h4>
      <div class="sample-table-wrap"><table class="batch-table">
        <thead><tr><th>文件</th><th>结果</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="preview-block">
      <h4>合并结果</h4>
      <div class="preview-stats">
        <div class="stat new"><div class="s-label">新增</div><div class="s-value">${agg.inserted.toLocaleString()} 条</div></div>
        <div class="stat dup"><div class="s-label">重复跳过</div><div class="s-value">${agg.skipped.toLocaleString()} 条</div></div>
        <div class="stat err"><div class="s-label">失败行数</div><div class="s-value">${agg.failed.toLocaleString()}</div></div>
      </div>
    </div>
    <div id="modal-actions">
      <button class="btn btn-primary" id="btn-done">完成</button>
    </div>`;
  $("#btn-done").addEventListener("click", () => {
    closeModal();
    const fileErrNote = agg.fileErrors ? `（${agg.fileErrors} 个文件解析失败）` : "";
    const msg = `已导入 ${agg.inserted.toLocaleString()} 条，跳过 ${agg.skipped.toLocaleString()} 条，失败 ${agg.failed} 条${fileErrNote}`;
    const failures = results.flatMap((r) => (r.failures || []).map((f) => ({ ...f, file: r.file_name })));
    addBanner(agg.failed > 0 || agg.fileErrors > 0 ? "error" : "success", msg, failures);
    refreshAll();
  });
}

function fmtDuration(sec) {
  const s = Math.round(Number(sec) || 0);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function convertElapsedSec(job) {
  if (!job || !job.started_at) return null;
  const t = new Date(job.started_at.replace(" ", "T"));
  if (Number.isNaN(t.getTime())) return null;
  return Math.max(0, Math.floor((Date.now() - t.getTime()) / 1000));
}
function runningConvertJob() {

function convertNameConflict(fileName) {
  // 与转换目录中同名 CSV 冲突 → 转换时将跳过（force 勾选除外）
  const stem = fileName.replace(/\.pdf$/i, "");
  return (meta.convert_existing_csvs || []).some((n) => n.toLowerCase() === (stem + ".csv").toLowerCase());

function handleConvertFiles(files) {
  // 校验同现有 handleFiles 口径：非 PDF 跳过（黄条）、同名忽略（黄条）、超 64MB 拒绝（红条）
  const notices = [];
  const seen = new Set(convertSelected.map((f) => f.name.toLowerCase()));
  const dupNames = [];
  const invalid = [];
  const oversized = [];
  const added = [];
  for (const f of files) {
    const key = f.name.toLowerCase();
    if (seen.has(key)) { dupNames.push(f.name); continue; }
    if (!key.endsWith(".pdf")) { invalid.push(f.name); continue; }
    if (f.size > 64 * 1024 * 1024) { oversized.push(f.name); continue; }
    seen.add(key);
    added.push(f);
  }
  if (invalid.length) notices.push(`以下 ${invalid.length} 个文件不是 PDF，已跳过：${invalid.join("、")}`);
  if (dupNames.length) notices.push(`同一次选择中的 ${dupNames.length} 个同名文件已忽略：${dupNames.join("、")}`);
  convertWarn = notices.length ? notices.join("；") : null;
  convertSelected.push(...added);
  if (!convertSelected.length) {
    renderConvertSelect();
    convertModalError(oversized.length
      ? `文件超过 64MB 上限：${oversized.join("、")}`
      : "未选择有效的 PDF 文件（仅支持 .pdf）");
    return;
  }
  renderConvertSelect();
  if (oversized.length) convertModalError(`文件超过 64MB 上限：${oversized.join("、")}`);
}
async function startConvert() {
  const files = convertSelected;
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append("files", f, f.name);
  fd.append("scale", convertParams.scale);
  fd.append("device", convertParams.device);
  fd.append("timeout_minutes", String(convertParams.timeout || 60));
  fd.append("force", convertParams.force ? "1" : "0");
  renderConvertLoading("正在上传 PDF 并启动转换 …");
  try {
    const res = await fetch("/api/boc/convert", { method: "POST", body: fd })
      .then((r) => r.json().catch(() => ({ ok: false, error: "响应解析失败" })));
    if (!res.ok) {
      if (res.job_id) { convertJobId = res.job_id; pollConvert(); return; }  // 409：衔接进行中的任务
      renderConvertSelect();
      convertModalError(res.error || "启动转换失败");
      return;
    }
    convertJobId = res.job_id;
    convertJob = null;
    convertResultSeen = false;
    sessionStorage.setItem("convertJobId", convertJobId);
    loadMeta().catch(() => {});  // 刷新 gpu_available 与已有 CSV 列表（首次任务触发探测）
    pollConvert();
  } catch (e) {
    renderConvertSelect();
    convertModalError("网络错误：" + e.message);
  }
}
function convertFileItemHtml(f) {
  let cls = "";
  let status = "";
  if (f.state === "running") {
    cls = "active";
    status = f.pages_total
      ? `第 ${f.pages_done}/${f.pages_total} 页 · 已识别 ${f.transactions.toLocaleString()} 条`
      : "正在加载 OCR 模型…";
  } else if (f.state === "done") {
    cls = "done";
    status = `成功 · ${f.transactions.toLocaleString()} 条 · 用时 ${fmtDuration(f.duration_s)}`;
  } else if (f.state === "skipped") {
    status = "跳过（同名 CSV 已存在）";
  } else if (f.state === "failed") {
    cls = "fail";
    status = `失败：${f.error || "未知错误"}`;
  } else {
    status = "等待中";
  }
  const dotCls = f.state === "done" ? "ok" : (f.state === "failed" ? "bad" : "mid");
  return `<div class="batch-file-item ${cls}">
    <span class="status-dot ${dotCls}"></span>
    <span class="bf-name" title="${esc(f.name)}">${esc(f.name)}</span>
    <span class="bf-status">${esc(status)}</span>
  </div>`;
}
function renderConvertProgress(job) {
  $("#btn-convert-close").textContent = "收起";  // 收起不取消任务，转换在后台继续
  if (!job) { renderConvertLoading("正在获取转换进度 …"); return; }
  const totals = job.totals || {};
  const finished = totals.done + totals.skipped + totals.failed;
  const total = job.files.length;
  const pct = total ? Math.round((finished / total) * 100) : 0;
  const elapsed = convertElapsedSec(job);
  const rows = job.files.map(convertFileItemHtml).join("");
  $("#convert-body").innerHTML = `
    <div class="preview-file">正在转换（${finished}/${total}）${elapsed !== null ? ` · 已用时 ${fmtDuration(elapsed)}` : ""}</div>
    <div class="batch-file-list">${rows}</div>
    <div class="progress-bar"><div class="fill determinate" style="width:${pct}%"></div></div>
    <div style="font-size:12px;color:#646A73;margin-top:8px">OCR 识别较慢，单个 PDF 可能需要数分钟，请耐心等待；可收起本窗口，转换在后台继续</div>`;
}
function pollConvert() {
  stopConvertPolling();
  convertPollTimer = setInterval(pollConvertOnce, 1500);
  pollConvertOnce();
}
function stopConvertPolling() {
  if (convertPollTimer) { clearInterval(convertPollTimer); convertPollTimer = null; }
}
async function pollConvertOnce() {
  if (!convertJobId) return;
  const res = await api("/api/boc/convert/" + convertJobId);
  if (!res.ok) { stopConvertPolling(); return; }
  if (res.status === "interrupted") {
    // 服务重启导致任务丢失（内存注册表）：提示重新开始
    stopConvertPolling();
    sessionStorage.removeItem("convertJobId");
    convertJobId = null;
    convertJob = null;
    updateConvertPill(null);
    if (!$("#convert-mask").hidden) {
      renderConvertSelect();
      convertModalError("上次转换任务已中断，请重新开始转换");
    }
    return;
  }
  convertJob = res;
  updateConvertPill(res);
  if (res.status === "running") {
    if (!$("#convert-mask").hidden) renderConvertProgress(res);
    return;
  }
  // 任务结束：胶囊消失；弹窗打开则展示结果视图，收起则页面 banner 提示
  stopConvertPolling();
  sessionStorage.removeItem("convertJobId");
  if ($("#convert-mask").hidden) showConvertResultBanner(res);
  else renderConvertResult(res);
}
function updateConvertPill(job) {
  // 顶栏胶囊指示（仅 BOC 页签、任务进行中）
  const pill = $("#convert-pill");
  const t = job ? job.totals : null;
  const running = job && job.status === "running";
  if (!running || currentSource !== "boc") { pill.hidden = true; return; }
  const finished = t.done + t.skipped + t.failed;
  pill.hidden = false;
  pill.textContent = `⟳ 转换中 ${finished}/${job.files.length}`;
}
function allFailedReason(job) {
  const f = job.files.find((x) => x.state === "failed");
  return f && f.error ? f.error : "全部 PDF 转换失败";
}
function renderConvertResult(job) {
  $("#btn-convert-close").textContent = "×";
  convertResultSeen = true;
  const t = job.totals || {};
  const doneFiles = job.files.filter((f) => f.state === "done");
  const allFailed = job.status === "failed";
  const partialWarn = (t.failed > 0 && !allFailed)
    ? `<div class="modal-warn">${t.failed} 个 PDF 转换失败，不影响其余结果，可直接导入成功的 CSV</div>` : "";
  const rows = job.files.map((f) => {
    if (f.state === "failed") return `<tr class="bf-error"><td>${esc(f.name)}</td><td>失败：${esc(f.error || "未知错误")}</td></tr>`;
    if (f.state === "done") return `<tr><td>${esc(f.name)}</td><td><span class="bf-new">成功</span> · ${f.transactions.toLocaleString()} 条 · 用时 ${fmtDuration(f.duration_s)}</td></tr>`;
    return `<tr><td>${esc(f.name)}</td><td>跳过（同名 CSV 已存在）</td></tr>`;
  }).join("");
  const dirNote = meta.convert_dir ? `<div class="dz-desc" style="margin-top:10px">CSV 存放于：${esc(meta.convert_dir)}</div>` : "";
  const allFailedBlock = allFailed
    ? `<div class="modal-error" style="display:block">${esc(allFailedReason(job))}</div>` : "";
  const primary = (allFailed || doneFiles.length === 0)
    ? `<button class="btn btn-primary" disabled>一键导入</button>
       <button class="btn" id="btn-convert-retry">调整参数重试</button>`
    : `<button class="btn btn-primary" id="btn-convert-import">一键导入（${doneFiles.length} 个 CSV · ${t.transactions.toLocaleString()} 条）</button>`;
  $("#convert-body").innerHTML = `
    ${partialWarn}
    <div class="preview-block">
      <h4>转换结果</h4>
      <div class="preview-stats">
        <div class="stat new"><div class="s-label">成功</div><div class="s-value">${t.done.toLocaleString()} 个</div></div>
        <div class="stat dup"><div class="s-label">跳过</div><div class="s-value">${t.skipped.toLocaleString()} 个</div></div>
        <div class="stat err"><div class="s-label">失败</div><div class="s-value">${t.failed.toLocaleString()} 个</div></div>
        <div class="stat"><div class="s-label">共提取交易</div><div class="s-value">${t.transactions.toLocaleString()} 条</div></div>
      </div>
      <div class="sample-table-wrap" style="margin-top:12px">
        <table><thead><tr><th>文件</th><th>结果</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
      ${dirNote}
      ${allFailedBlock}
    </div>
    <div id="convert-actions">
      ${primary}
      <button class="btn" id="btn-convert-opendir">打开 CSV 所在文件夹</button>
      <button class="btn" id="btn-convert-done">关闭</button>
    </div>`;
  const importBtn = $("#btn-convert-import");
  if (importBtn) importBtn.addEventListener("click", convertImportPreview);
  const retryBtn = $("#btn-convert-retry");
  if (retryBtn) retryBtn.addEventListener("click", renderConvertSelect);  // 保留已选文件，回阶段一调参重试
  $("#btn-convert-opendir").addEventListener("click", openConvertDir);
  $("#btn-convert-done").addEventListener("click", closeConvertModal);
}
async function openConvertDir() {
  try {
    const res = await api("/api/boc/convert/open-dir", { method: "POST" });
    if (!res.ok) showErrorBanner(res.error || "打开目录失败");
  } catch (e) { showErrorBanner("打开目录失败：" + e.message); }
}
function showConvertResultBanner(job) {
  const t = job.totals || {};
  const msg = `PDF 转换完成：成功 ${t.done} 个 · 跳过 ${t.skipped} 个 · 失败 ${t.failed} 个 · 共提取 ${t.transactions.toLocaleString()} 条交易`;
  addBanner(t.failed > 0 ? "error" : "success", msg, null);
  refreshAll();  // 刷新 meta（已有 CSV 列表变化）
}
function buildConvertModel(res) {
  // 转换产物预览模型：复用批量导入预览 UI（无 File 对象，确认时走任务 confirm 接口）
  return {
    source: res.source,
    columns: res.columns || [],
    expanded: new Set(res.files.length === 1 ? [res.files[0].file_name] : []),
    items: res.files.map((f) => ({
      file: null,
      name: f.file_name,
      error: f.error || null,
      removed: false,
      stats: f.error ? null : {
        row_count: f.row_count,
        error_count: f.error_count,
        invalid_count: f.invalid_count,
        new_count: f.new_count,
        dup_count: f.dup_count,
        date_min: f.date_min,
        date_max: f.date_max,
        distribution: f.distribution || [],
        sample: f.sample || [],
      },
    })),
  };
}
async function convertImportPreview() {
  renderConvertLoading("正在解析 CSV 并做去重比对 …");
  try {
    const res = await api(`/api/boc/convert/${convertJobId}/preview`, { method: "POST" });
    if (!res.ok) { renderConvertResult(convertJob); convertModalError(res.error || "预览失败"); return; }
    renderBatchPreview(buildConvertModel(res), "convert");
  } catch (e) {
    renderConvertResult(convertJob);
    convertModalError("网络错误：" + e.message);
  }
}
async function confirmConvertImport(model) {
  const kept = model.items.filter((f) => !f.removed).map((f) => f.name);
  renderConvertLoading("正在写入 SQLite …");
  try {
    const res = await api(`/api/boc/convert/${convertJobId}/confirm`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: kept }),
    });
    if (!res.ok) { renderConvertResult(convertJob); convertModalError(res.error || "导入失败"); return; }
    closeConvertModal();
    const fileRows = res.files || [];
    const fileErrCount = fileRows.filter((r) => r.error).length;
    const msg = `已导入 ${(res.inserted || 0).toLocaleString()} 条，跳过 ${(res.skipped || 0).toLocaleString()} 条，失败 ${(res.failed || 0)} 条${fileErrCount ? `（${fileErrCount} 个文件解析失败）` : ""}`;
    const failures = fileRows.flatMap((r) => (r.failures || []).map((f) => ({ ...f, file: r.file_name })));
    addBanner((res.failed || 0) > 0 || fileErrCount > 0 ? "error" : "success", msg, failures);
    await refreshAll();
  } catch (e) {
    renderConvertResult(convertJob);
    convertModalError("网络错误：" + e.message);
  }
}
async function resumeConvertSession() {
  // 页面刷新后重连：sessionStorage 的任务仍在运行则续轮询；已结束则 banner；服务已重启则提示中断
  const stored = sessionStorage.getItem("convertJobId");
  if (!stored) return;
  convertJobId = stored;
  try {
    const res = await api("/api/boc/convert/" + stored);
    if (!res.ok || res.status === "interrupted") {
      sessionStorage.removeItem("convertJobId");
      convertJobId = null;
      convertInterrupted = true;
      return;
    }
    if (res.status === "running") {
      convertJob = res;
      updateConvertPill(res);
      pollConvert();
    } else {
      sessionStorage.removeItem("convertJobId");
      convertJob = res;  // 保留结束态快照：重开弹窗直达结果视图
      showConvertResultBanner(res);
    }
  } catch (e) {
    // 网络异常静默：下次打开弹窗时按中断提示处理
  }
}

/* ================= 事件绑定 ================= */
$("#btn-import").addEventListener("click", openModal);
$("#btn-import-empty").addEventListener("click", () => {
  if (currentSource === TOTAL) switchTab("boc");  // 总账户空态「去数据源导入」→ 跳转第一个数据源视图
  else openModal();
});
$("#filter-toggle").addEventListener("click", () => {
  filterPanelOpen = !filterPanelOpen;
  applyFilterPanelOpen();
});
$("#btn-refresh").addEventListener("click", refreshAll);
$("#btn-modal-close").addEventListener("click", closeModal);
$("#modal-mask").addEventListener("click", (e) => { if (e.target.id === "modal-mask") closeModal(); });
$("#btn-convert").addEventListener("click", openConvertModal);
$("#btn-convert-empty").addEventListener("click", openConvertModal);
$("#btn-convert-close").addEventListener("click", closeConvertModal);
$("#convert-mask").addEventListener("click", (e) => { if (e.target.id === "convert-mask") closeConvertModal(); });
$("#convert-pill").addEventListener("click", openConvertModal);
$("#btn-tags-manage").addEventListener("click", openTagsModal);
$("#btn-tags-modal-close").addEventListener("click", closeTagsModal);
$("#tags-modal-mask").addEventListener("click", (e) => { if (e.target.id === "tags-modal-mask") closeTagsModal(); });
$("#btn-tagpick-close").addEventListener("click", closeTagPick);
$("#tagpick-modal-mask").addEventListener("click", (e) => { if (e.target.id === "tagpick-modal-mask") closeTagPick(); });
$("#btn-reset").addEventListener("click", resetFilters);
$("#search").addEventListener("input", debounce((e) => {
  filtersBySource[currentSource].q = e.target.value.trim();
  pageBySource[currentSource] = 1;
  loadRows().then(loadSummary).catch((err) => showErrorBanner(err.message));
}, 300));
$("#pagesize").addEventListener("change", (e) => {
  pageSizeBySource[currentSource] = Number(e.target.value);
  pageBySource[currentSource] = 1;
  loadRows();
});
$("#date-from").addEventListener("change", (e) => { filtersBySource[currentSource].date_from = e.target.value; onFilterChange(); });
$("#date-to").addEventListener("change", (e) => { filtersBySource[currentSource].date_to = e.target.value; onFilterChange(); });
$("#amount-min").addEventListener("input", debounce((e) => { filtersBySource[currentSource].amount_min = e.target.value; onFilterChange(); }, 300));
$("#amount-max").addEventListener("input", debounce((e) => { filtersBySource[currentSource].amount_max = e.target.value; onFilterChange(); }, 300));
document.querySelectorAll("#presets .preset").forEach((b) =>
  b.addEventListener("click", () => applyPreset(b.dataset.preset)));
$("#btn-colset").addEventListener("click", () => $("#colset").classList.toggle("open"));
document.addEventListener("click", (e) => {
  if (!$("#colset").contains(e.target)) $("#colset").classList.remove("open");
});

/* ================= 启动 ================= */
(async function init() {
  try {
    await loadMeta();
    await loadOptions(currentSource, false);
    if (currentSource === TOTAL) {
      // 与 switchTab 的总账户分支一致：行详情依赖各源列信息，筛选面板标签区块依赖标签列表
      await Promise.all(["boc", "alipay", "wechat"].map((s) => loadOptions(s, false)));
      await loadTags();
    }
    renderNav(); renderFilterPanel(); renderToolbar();
    applyFilterPanelOpen();
    await Promise.all([loadRows(), loadSummary()]);
    await resumeConvertSession();  // 刷新后重连转换任务（续轮询 / 完成 banner / 中断提示）
  } catch (e) {
    showErrorBanner(e.message);
    renderNav();
  }
})();
</script>
</body>
</html>
