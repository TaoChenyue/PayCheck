<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单工作台</title>
<style>
:root {
  --income: #00B578;
  --expense: #1F2329;
  --neutral: #8C8C8C;
  --border: #E5E6EB;
  --page-bg: #F7F8FA;
  --thead-bg: #F5F6F7;
  --row-hover: #F7F9FA;
  --text: #1F2329;
  --text-2: #646A73;
  --danger: #D83931;
}
body[data-source="boc"] { --brand: #C8102E; }
body[data-source="alipay"] { --brand: #1677FF; }
body[data-source="wechat"] { --brand: #07C160; }
body[data-source="total"] { --brand: #7C4DFF; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px; color: var(--text); background: var(--page-bg);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 56px;
  background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#topbar .brand { font-size: 17px; font-weight: 600; white-space: nowrap; }
#btn-collapse {
  border: none; background: none; cursor: pointer; font-size: 16px; color: var(--text-2);
  padding: 4px 8px; border-radius: 6px; line-height: 1;
}
#btn-collapse:hover { background: var(--row-hover); }
#tabs { display: flex; gap: 4px; flex: 1; min-width: 0; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px;
  cursor: pointer; color: var(--text-2); border: none; background: none; font-size: 14px;
  white-space: nowrap;
}
.tab:hover { background: var(--row-hover); }
.tab.active { color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, #fff); font-weight: 600; }
.tab .badge {
  background: color-mix(in srgb, var(--brand) 12%, #fff); color: var(--brand);
  border-radius: 999px; padding: 1px 8px; font-size: 12px; font-variant-numeric: tabular-nums;
}
.topbar-actions { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; font-size: 14px; white-space: nowrap;
}
.btn:hover { background: var(--row-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
.btn-primary:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }

/* ---------- 布局 ---------- */
#layout { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 320px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
  padding: 16px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 18px;
}
#layout.sidebar-collapsed #sidebar { display: none; }
.sidebar-section h3 { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.preset {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 10px;
  font-size: 12px; cursor: pointer; color: var(--text-2);
}
.preset:hover { border-color: var(--brand); color: var(--brand); }
.preset.active { border-color: var(--brand); color: var(--brand); background: color-mix(in srgb, var(--brand) 6%, #fff); }
.date-inputs { display: flex; align-items: center; gap: 6px; }
.date-inputs input {
  width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px;
  color: var(--text);
}
.date-inputs input:focus { outline: none; border-color: var(--brand); }
.checkbox-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.checkbox-list label {
  display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text);
  padding: 3px 4px; border-radius: 4px; min-width: 0;
}
.checkbox-list label .lbl { min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
.checkbox-list label:hover { background: var(--row-hover); }
.checkbox-list input { accent-color: var(--brand); }
#category-list { max-height: 240px; overflow-y: auto; }
.amount-inputs { display: flex; align-items: center; gap: 6px; }
.amount-inputs input {
  width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px;
}
.amount-inputs input:focus { outline: none; border-color: var(--brand); }
#btn-reset { margin-top: auto; }

/* ---------- 主区 ---------- */
#main {
  flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 16px 20px; gap: 14px;
  overflow-y: auto;
}
#banners:empty { display: none; }
.banner {
  border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px;
  align-items: flex-start; border: 1px solid;
}
.banner.success { background: #EDFBF4; border-color: #B8ECD5; color: #007A52; }
.banner.error { background: #FEF0EF; border-color: #F6C5C2; color: var(--danger); }
.banner .banner-close { margin-left: auto; cursor: pointer; border: none; background: none; color: inherit; font-size: 14px; }
.banner .expand-link { cursor: pointer; text-decoration: underline; margin-top: 6px; }
.banner ul { margin: 6px 0 0 18px; }
.banner ul li { margin: 2px 0; }

#cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.card {
  background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
}
.card .card-title { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.card .card-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .card-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.card.income .card-value { color: var(--income); }
.card.expense .card-value { color: var(--expense); }
.card.neutral .card-value { color: var(--neutral); }

#toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#search {
  flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px;
  font-size: 13px;
}
#search:focus { outline: none; border-color: var(--brand); }
#pagesize { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
/* 列设置下拉 */
#colset { position: relative; }
#colset-panel {
  position: absolute; top: calc(100% + 4px); right: 0; background: #fff; border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.08); padding: 8px; width: 190px; z-index: 20;
  display: none; max-height: 320px; overflow-y: auto;
}
#colset.open #colset-panel { display: flex; flex-direction: column; gap: 4px; }
#colset-panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; cursor: pointer; border-radius: 4px; }
#colset-panel label:hover { background: var(--row-hover); }
#colset-panel input { accent-color: var(--brand); }

/* ---------- 表格 ---------- */
#table-wrap { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
#table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--thead-bg); color: var(--text-2); font-weight: 500; text-align: left;
  padding: 12px 16px; white-space: nowrap; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; user-select: none;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--text); }
thead th .sort-icon { display: inline-block; width: 14px; font-size: 11px; margin-left: 2px; color: var(--brand); }
tbody td { padding: 12px 16px; border-bottom: 1px solid var(--row-hover); vertical-align: top; }
tbody tr.data-row { cursor: pointer; }
tbody tr.data-row:hover td { background: var(--row-hover); }
tbody tr:last-child td { border-bottom: none; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.ellipsis { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.empty-val { color: #C4C7CC; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap;
}
.tag.income { background: #E8F8F0; color: #007A52; }
.tag.expense { background: #F0F1F3; color: #3A3F46; }
.tag.neutral { background: #F2F3F5; color: var(--neutral); }
.money.income { color: var(--income); }
.money.expense { color: var(--expense); }
.money.neutral { color: var(--neutral); }
.status-badge { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; }
.status-dot.ok { background: var(--income); }
.status-dot.bad { background: var(--danger); }
.status-dot.mid { background: #C4C7CC; }
.copy-btn {
  border: 1px solid var(--border); background: none; border-radius: 4px; cursor: pointer;
  padding: 1px 6px; font-size: 11px; color: var(--text-2); margin-left: 6px; vertical-align: 1px;
}
.copy-btn:hover { color: var(--brand); border-color: var(--brand); }
/* 行展开详情 */
tr.detail-row td { background: #FAFBFC; padding: 14px 20px; cursor: default; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 24px; }
.detail-item .k { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
.detail-item .v { font-size: 13px; word-break: break-all; }

#pagination { display: flex; align-items: center; justify-content: flex-end; gap: 12px; font-size: 13px; color: var(--text-2); }
#pagination button {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer;
}
#pagination button:disabled { opacity: .4; cursor: not-allowed; }

/* 空状态 */
#empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 72px 20px; text-align: center;
}
#empty-state .empty-title { font-size: 16px; font-weight: 600; }
#empty-state .empty-desc { font-size: 13px; color: var(--text-2); line-height: 1.7; }

/* 骨架屏 */
.skeleton-row td { padding: 12px 16px; }
.skeleton-block { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #F0F1F3 25%, #E8E9EC 50%, #F0F1F3 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- 总账户：来源徽标 / 内部转账 / 折叠条 / 模式切换 ---------- */
.src-badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
  color: #fff; font-weight: 600; white-space: nowrap;
}
.src-badge.s-boc { background: #C8102E; }
.src-badge.s-ali { background: #1677FF; }
.src-badge.s-wx { background: #07C160; }
/* ---------- 总账户：三区（真实收入/真实支出/内部流动） ---------- */
.zone { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.zone:last-child { margin-bottom: 0; }
.zone-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
}
.zone-title { font-weight: 600; white-space: nowrap; }
.zone-sub { font-size: 12px; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zone-collapse { margin-left: auto; color: var(--text-2); font-size: 12px; white-space: nowrap; }
.zone-table-wrap { overflow-x: auto; }
.zone-empty { padding: 18px 16px; color: #C4C7CC; font-size: 13px; }
.zonedesc { padding: 8px 16px; font-size: 12px; color: var(--text-2); background: var(--page-bg); border-bottom: 1px solid var(--border); }
.tag.flow {
  background: color-mix(in srgb, var(--brand) 10%, #fff); color: var(--brand);
  border: 1px solid color-mix(in srgb, var(--brand) 40%, #fff);
}
.tag.dup { background: #FFF7E8; color: #B25E09; border: 1px solid #E8C98A; }
tr.flow-main td { cursor: pointer; }
tr.flow-member td { background: #FAFBFC; color: var(--text-2); font-size: 12px; }
.grp-pair { color: var(--text-2); font-size: 12px; margin-left: 8px; }
.grp-arrow { color: var(--text-2); font-size: 12px; margin: 0 4px 0 8px; }
.grp-badge { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.zone-expand-all {
  color: var(--brand); font-size: 12px; white-space: nowrap; padding: 2px 8px; border-radius: 6px;
}
.zone-expand-all:hover { background: var(--row-hover); }
tr.flow-more td { text-align: center; color: var(--brand); cursor: pointer; font-size: 12px; padding: 8px; }
tr.grp-hint-row td { padding: 6px 16px; background: var(--page-bg); }
.grp-hint { font-size: 12px; color: var(--text-2); }
.zone-pagination {
  display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  font-size: 13px; color: var(--text-2); padding: 10px 16px; border-top: 1px solid var(--border);
}
.zone-pagination button {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 12px; cursor: pointer;
}
.zone-pagination button:disabled { opacity: .4; cursor: not-allowed; }
#total-tools { display: flex; align-items: center; gap: 8px; }

/* ---------- 规则设置弹窗 ---------- */
#rules-modal-mask {
  position: fixed; inset: 0; background: rgba(31, 35, 41, .45); z-index: 120;
  display: flex; align-items: center; justify-content: center;
}
#rules-modal-mask[hidden] { display: none; }
#rules-modal {
  background: #fff; border-radius: 12px; width: min(880px, 94vw); max-height: 88vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
#rules-modal-header {
  display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 600;
}
#rules-modal-header .close { margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-2); }
#rules-modal-body { padding: 20px; }
#rules-banner {
  border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; border: 1px solid;
  display: flex; gap: 10px; align-items: center;
}
#rules-banner.success { background: #EDFBF4; border-color: #B8ECD5; color: #007A52; }
#rules-banner.warn { background: #FFF9E6; border-color: #F2DEB3; color: #8A6D1F; }
#rules-banner .banner-close { margin-left: auto; cursor: pointer; border: none; background: none; color: inherit; font-size: 14px; }
.rules-toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
.rule-group { margin-bottom: 18px; }
.rule-group h4 { font-size: 13px; color: var(--text-2); font-weight: 600; margin-bottom: 8px; }
.rule-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.rule-item.off { opacity: .55; }
.rule-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rule-name { font-weight: 600; }
.rule-cond { color: var(--text-2); font-size: 12px; margin-top: 4px; }
.rule-hit { font-size: 12px; color: var(--text-2); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rule-ops { display: flex; gap: 6px; align-items: center; }
.rule-ops button {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 2px 8px;
  font-size: 12px; cursor: pointer; color: var(--text-2);
}
.rule-ops button:hover { color: var(--brand); border-color: var(--brand); }
.rule-ops button.danger:hover { color: var(--danger); border-color: var(--danger); }
.rule-detail { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-2); }
.rule-detail .cond-line { margin: 2px 0; }
.switch { position: relative; display: inline-block; width: 34px; height: 18px; vertical-align: middle; cursor: pointer; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; background: #C4C7CC; border-radius: 999px; transition: .15s; }
.switch .slider::before {
  content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px;
  background: #fff; border-radius: 50%; transition: .15s;
}
.switch input:checked + .slider { background: var(--brand); }
.switch input:checked + .slider::before { transform: translateX(16px); }
.rule-form { display: flex; flex-direction: column; gap: 12px; }
.rule-form .f-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rule-form .f-label { font-size: 13px; color: var(--text-2); min-width: 72px; flex-shrink: 0; }
.rule-form input.txt, .rule-form select.sel {
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px;
  color: var(--text); background: #fff;
}
.rule-form input.txt:focus, .rule-form select.sel:focus { outline: none; border-color: var(--brand); }
.rule-form .cond-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rule-form .cond-row select, .rule-form .cond-row input {
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; background: #fff;
}
.rule-form .cond-row select:focus, .rule-form .cond-row input:focus { outline: none; border-color: var(--brand); }
.rule-form .cond-val { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 2px; }
.rule-form .cond-val input { width: 100%; }
.rule-form .hint { font-size: 12px; color: var(--text-2); }
.radio-line { display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.radio-line label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-width: auto; }
.hit-preview { font-size: 12px; color: var(--text-2); margin-left: auto; font-variant-numeric: tabular-nums; }
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.preset-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.preset-head { display: flex; align-items: center; gap: 8px; }
.preset-name { font-weight: 600; }
.preset-desc { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.preset-meta { font-size: 12px; color: var(--text-2); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.preset-rules { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.preset-rule { font-size: 12px; color: var(--text-2); margin: 4px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge {
  display: inline-block; font-size: 11px; border-radius: 999px; padding: 0 8px;
  border: 1px solid var(--border); color: var(--text-2); white-space: nowrap;
}

/* ---------- 导入弹窗 ---------- */
#modal-mask {
  position: fixed; inset: 0; background: rgba(31, 35, 41, .45); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
#modal-mask[hidden] { display: none; }
#modal {
  background: #fff; border-radius: 12px; width: min(760px, 92vw); max-height: 88vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
#modal-header {
  display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 600;
}
#modal-header .close { margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-2); }
#modal-body { padding: 20px; }
#dropzone {
  border: 2px dashed var(--border); border-radius: 10px; padding: 48px 20px; text-align: center;
  cursor: pointer; color: var(--text-2); transition: border-color .15s;
}
#dropzone:hover, #dropzone.dragover { border-color: var(--brand); color: var(--brand); }
#dropzone .dz-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
#dropzone .dz-desc { font-size: 12px; margin-top: 4px; }
#modal-error {
  background: #FEF0EF; border: 1px solid #F6C5C2; color: var(--danger); border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none;
}
.modal-warn {
  background: #FFF9E6; border: 1px solid #F2DEB3; color: #8A6D1F; border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; word-break: break-all;
}
/* 批量导入：逐文件可展开卡片 / 进度列表 / 确定进度条 */
.sample-table-wrap th.num { text-align: right; }
tr.bf-error td { color: var(--danger); }
.bf-new { color: var(--income); font-weight: 600; }
.bf-fail { color: var(--danger); font-weight: 600; }
.file-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; background: #fff; }
.file-card.error { border-color: #F6C5C2; background: #FEF0EF; }
.file-card-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
  font-size: 13px; user-select: none;
}
.file-card-head:hover { background: var(--row-hover); }
.file-card .fc-toggle { width: 14px; color: var(--text-2); flex-shrink: 0; }
.file-card .fc-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-card .fc-summary { color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.file-card.error .fc-summary { color: var(--danger); }
.fc-remove {
  border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer;
  padding: 2px 8px; font-size: 12px; color: var(--text-2); flex-shrink: 0;
}
.fc-remove:hover { color: var(--danger); border-color: var(--danger); }
.file-card-body { padding: 10px 14px 14px; border-top: 1px solid var(--border); }
.file-card-body h5 { font-size: 12px; color: var(--text-2); margin: 6px 0; font-weight: 600; }
.batch-merged-extra { font-size: 13px; color: var(--text-2); margin-top: 10px; line-height: 1.8; }
.batch-file-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.batch-file-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px;
}
.batch-file-item .bf-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-file-item .bf-status { color: var(--text-2); white-space: nowrap; }
.batch-file-item.active { border-color: var(--brand); }
.batch-file-item.active .bf-status { color: var(--brand); }
.batch-file-item.done .bf-status { color: var(--income); }
.batch-file-item.fail { border-color: #F6C5C2; background: #FEF0EF; }
.batch-file-item.fail .bf-status { color: var(--danger); }
.progress-bar .fill.determinate { width: 0%; animation: none; transition: width .25s; }
.preview-block { margin-bottom: 18px; }
.preview-block h4 { font-size: 13px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
.preview-file { font-size: 14px; font-weight: 600; margin-bottom: 12px; word-break: break-all; }
.preview-stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat {
  background: var(--page-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  min-width: 110px;
}
.stat .s-label { font-size: 12px; color: var(--text-2); }
.stat .s-value { font-size: 15px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat.new .s-value { color: var(--income); }
.stat.dup .s-value { color: var(--neutral); }
.stat.err .s-value { color: var(--danger); }
.sample-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.sample-table-wrap table { font-size: 12px; }
.sample-table-wrap thead th { padding: 8px 10px; }
.sample-table-wrap td { padding: 8px 10px; white-space: nowrap; }
#modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.progress-bar { height: 8px; border-radius: 4px; background: var(--page-bg); overflow: hidden; margin-top: 14px; }
.progress-bar .fill { height: 100%; width: 40%; background: var(--brand); border-radius: 4px; animation: slide 1s infinite linear; }
@keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }
</style>
</head>
<body data-source="boc">
<header id="topbar">
  <button id="btn-collapse" title="收起/展开筛选栏">☰</button>
  <div class="brand">账单工作台</div>
  <nav id="tabs"></nav>
  <div class="topbar-actions">
    <button id="btn-import" class="btn btn-primary">导入账单</button>
    <button id="btn-refresh" class="btn">刷新</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-section">
      <h3>日期范围</h3>
      <div class="presets" id="presets">
        <button class="preset" data-preset="this-month">本月</button>
        <button class="preset" data-preset="last-month">上月</button>
        <button class="preset" data-preset="recent-3m">近3月</button>
        <button class="preset" data-preset="custom">自定义</button>
      </div>
      <div class="date-inputs">
        <input type="date" id="date-from">
        <span>—</span>
        <input type="date" id="date-to">
      </div>
    </div>
    <div class="sidebar-section">
      <h3>收/支</h3>
      <div class="checkbox-list" id="direction-list"></div>
    </div>
    <div class="sidebar-section">
      <h3 id="category-title">分类</h3>
      <div class="checkbox-list" id="category-list"></div>
    </div>
    <div class="sidebar-section">
      <h3>金额区间</h3>
      <div class="amount-inputs">
        <input type="number" id="amount-min" placeholder="最小" step="0.01">
        <span>—</span>
        <input type="number" id="amount-max" placeholder="最大" step="0.01">
      </div>
    </div>
    <button id="btn-reset" class="btn">重置筛选</button>
  </aside>

  <main id="main">
    <div id="banners"></div>
    <div id="cards"></div>
    <div id="toolbar">
      <input type="search" id="search" placeholder="搜索…">
      <div id="total-tools" hidden>
        <button class="btn" id="btn-rules">规则设置</button>
      </div>
      <div id="colset">
        <button class="btn" id="btn-colset">列设置 ▾</button>
        <div id="colset-panel"></div>
      </div>
      <select id="pagesize">
        <option value="10">10 条/页</option>
        <option value="50" selected>50 条/页</option>
        <option value="100">100 条/页</option>
        <option value="200">200 条/页</option>
      </select>
    </div>
    <div id="table-wrap">
      <div id="table-scroll">
        <table id="table">
          <thead><tr id="table-head"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="total-zones" hidden>
        <section class="zone" id="zone-income"></section>
        <section class="zone" id="zone-expense"></section>
        <section class="zone" id="zone-flow"></section>
      </div>
      <div id="empty-state" hidden>
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C4C7CC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>
        </svg>
        <div class="empty-title">暂无账单数据</div>
        <div class="empty-desc" id="empty-desc"></div>
        <button class="btn btn-primary" id="btn-import-empty">导入账单</button>
      </div>
    </div>
    <div id="pagination"></div>
  </main>
</div>

<div id="modal-mask" hidden>
  <div id="modal">
    <div id="modal-header">导入账单<span id="modal-source-label"></span>
      <button class="close" id="btn-modal-close">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="rules-modal-mask" hidden>
  <div id="rules-modal">
    <div id="rules-modal-header">规则设置
      <button class="close" id="btn-rules-close">×</button>
    </div>
    <div id="rules-modal-body"></div>
  </div>
</div>

<script>
"use strict";
/* ================= 状态 ================= */
const SOURCE_LABELS = {};   // 由 /api/meta 填充
const ACCEPT = { boc: ".csv", alipay: ".csv", wechat: ".xlsx,.csv" };
const FORMAT_DESC = {
  boc: "BOC CSV（boc-pdf2csv 输出，UTF-8）",
  alipay: "支付宝网页版导出 CSV（GBK）",
  wechat: "微信支付账单 XLSX（兼容 CSV）",
};

let currentSource = "boc";
let meta = { counts: {} };
let optionsCache = {};          // source -> options
let filtersBySource = {};       // source -> 筛选状态
let sortBySource = {};          // source -> {key, order}  order: 'asc'|'desc'|null
let visibleColsBySource = {};   // source -> Set(逻辑列 key)
let pageBySource = {};
let pageSizeBySource = {};
let expandedRow = null;         // 当前展开的明细 id
let modalSource = null;         // 弹窗打开时的数据源
let modalFile = null;           // 已选文件（单文件流程）
let modalFiles = null;          // 批量模式的有效文件列表
let modalWarn = null;           // 类型不符/同名被跳过的文件提示
let batchImporting = false;     // 批量写入进行中（禁止关闭弹窗）
let lastSummary = null;       // 最近一次汇总响应（总账户区头合计展示）
let lastTotal = null;         // 最近一次总账户三区响应
let collapsedZones = { income: false, expense: false, flow: false };  // 总账户区块收起状态
let totalZonePages = { income: 1, expense: 1, flow: 1 };  // 总账户三区各自独立分页
let expandedFlowGroups = new Set();  // 内部流动区已展开的组（组 key）
let flowShownAll = new Set();        // 内部流动区已「展开更多」的组（组 key）
let flowAllExpanded = false;         // 内部流动区「全部展开」开关
const FLOW_MEMBER_CHUNK = 50;        // 组内成员先显示前 50 行，其余「展开更多」

const TOTAL = "total";
const TAB_ORDER = ["boc", "alipay", "wechat", TOTAL];
const SRC_BADGE_CLS = { boc: "s-boc", alipay: "s-ali", wechat: "s-wx" };
const TOTAL_LABEL = "总账户";

function freshFilters() {
  return { q: "", date_from: "", date_to: "", directions: [], categories: [],
           amount_min: "", amount_max: "", sources: ["boc", "alipay", "wechat"] };
}
for (const s of TAB_ORDER) {
  filtersBySource[s] = freshFilters();
  sortBySource[s] = { key: "datetime", order: "desc" };
  pageBySource[s] = 1;
  pageSizeBySource[s] = 50;
}

/* ================= 工具 ================= */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function fmtMoney(v) {
  if (v === "" || v === null || v === undefined) return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  return n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function dirInfo(row) {
  const d = row[optionsCache[currentSource].direction_col] || "";
  if (d === "收入") return { cls: "income", sign: "+", label: "收入" };
  if (d === "支出") return { cls: "expense", sign: "−", label: "支出" };
  return { cls: "neutral", sign: "", label: d || "—" };
}
function moneyHtml(row) {
  const o = optionsCache[currentSource];
  const d = dirInfo(row);
  const v = row[o.amount_col];
  if (v === "" || v === null || v === undefined) return '<span class="empty-val">—</span>';
  return `<span class="money ${d.cls}">${d.sign}${fmtMoney(v)}</span>`;
}
function statusHtml(v) {
  if (!v) return '<span class="empty-val">—</span>';
  let cls = "mid";
  if (v.includes("成功")) cls = "ok";
  else if (v.includes("失败") || v.includes("关闭") || v.includes("退")) cls = "bad";
  return `<span class="status-badge"><span class="status-dot ${cls}"></span>${esc(v)}</span>`;
}
function dirTagHtml(row) {
  const d = dirInfo(row);
  if (d.label === "—") return '<span class="empty-val">—</span>';
  return `<span class="tag ${d.cls}">${esc(d.label)}</span>`;
}
function srcBadgeHtml(source) {
  return `<span class="src-badge ${SRC_BADGE_CLS[source] || ""}">${esc(SOURCE_LABELS[source] || source)}</span>`;
}
function markHtml(row) {
  const names = esc((row.rule_names || []).join("、"));
  const title = names ? ` title="命中规则：${names}"` : "";
  if (row.mark === "duplicate") return `<span class="tag dup"${title}>重复记录</span>`;
  if (row.mark === "flow") return `<span class="tag flow"${title}>内部流动</span>`;
  return '<span class="empty-val">—</span>';
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
}
function api(path, opts) {
  return fetch(path, opts).then((r) => r.json().catch(() => ({ ok: false, error: "响应解析失败" })));
}
function extOk(name) {
  const dot = name.lastIndexOf(".");
  const ext = dot >= 0 ? name.slice(dot).toLowerCase() : "";
  return ACCEPT[modalSource].split(",").map((s) => s.trim()).includes(ext);
}

/* ================= 数据加载 ================= */
async function loadMeta() {
  const res = await api("/api/meta");
  if (!res.ok) throw new Error(res.error || "获取元信息失败");
  meta = res;
  for (const s of res.sources) SOURCE_LABELS[s.name] = s.label;
}
async function loadOptions(source, force) {
  if (!force && optionsCache[source]) return optionsCache[source];
  const res = await api("/api/options?source=" + encodeURIComponent(source));
  if (!res.ok) throw new Error(res.error || "获取列信息失败");
  optionsCache[source] = res;
  if (!visibleColsBySource[source]) {
    visibleColsBySource[source] = new Set(res.columns.filter((c) => c.visible).map((c) => c.key));
  }
  return res;
}
function filterQuery() {
  const f = filtersBySource[currentSource];
  const p = new URLSearchParams();
  p.set("source", currentSource);
  if (f.q) p.set("q", f.q);
  if (f.date_from) p.set("date_from", f.date_from);
  if (f.date_to) p.set("date_to", f.date_to);
  if (f.directions.length) p.set("directions", f.directions.join(","));
  if (currentSource === TOTAL) {
    if (f.sources.length) p.set("sources", f.sources.join(","));
    p.set("income_page", totalZonePages.income);
    p.set("expense_page", totalZonePages.expense);
    p.set("flow_page", totalZonePages.flow);
  } else if (f.categories.length) {
    p.set("categories", f.categories.join(","));
  }
  if (f.amount_min !== "") p.set("amount_min", f.amount_min);
  if (f.amount_max !== "") p.set("amount_max", f.amount_max);
  return p;
}
async function loadRows() {
  const p = filterQuery();
  p.set("page", pageBySource[currentSource]);
  p.set("page_size", pageSizeBySource[currentSource]);
  const s = sortBySource[currentSource];
  if (s.order) { p.set("sort", s.key); p.set("order", s.order); }
  if (currentSource === TOTAL) showTotalSkeleton(); else showSkeleton();
  const res = await api("/api/rows?" + p.toString());
  if (!res.ok) throw new Error(res.error || "查询失败");
  renderTable(res);
}
async function loadSummary() {
  const p = filterQuery();
  const res = await api("/api/summary?" + p.toString());
  if (!res.ok) throw new Error(res.error || "汇总失败");
  renderCards(res);
}
async function refreshAll() {
  try {
    await Promise.all([loadMeta(), loadOptions(currentSource, true)]);
    renderTabs(); renderSidebar(); renderToolbar();
    await Promise.all([loadRows(), loadSummary()]);
  } catch (e) { showErrorBanner(e.message); }
}

/* ================= 渲染 ================= */
function renderTabs() {
  const nav = $("#tabs");
  nav.innerHTML = "";
  for (const s of TAB_ORDER) {
    const btn = document.createElement("button");
    btn.className = "tab" + (s === currentSource ? " active" : "");
    const label = s === TOTAL ? TOTAL_LABEL : (SOURCE_LABELS[s] || s);
    const count = s === TOTAL
      ? (meta.counts.boc ?? 0) + (meta.counts.alipay ?? 0) + (meta.counts.wechat ?? 0)
      : (meta.counts[s] ?? 0);
    btn.innerHTML = `${esc(label)} <span class="badge">${count.toLocaleString()}</span>`;
    btn.onclick = () => switchTab(s);
    nav.appendChild(btn);
  }
  document.body.dataset.source = currentSource;
}
function renderSidebar() {
  const o = optionsCache[currentSource];
  const f = filtersBySource[currentSource];
  $("#category-title").textContent = o.category_label || "分类";
  // 收/支
  $("#direction-list").innerHTML = o.directions.map((d) =>
    `<label><input type="checkbox" value="${esc(d)}" ${f.directions.includes(d) ? "checked" : ""}> <span class="lbl">${esc(d)}</span></label>`
  ).join("");
  $("#direction-list").querySelectorAll("input").forEach((el) =>
    el.addEventListener("change", () => {
      f.directions = [...$("#direction-list").querySelectorAll("input:checked")].map((i) => i.value);
      onFilterChange();
    }));
  // 分类：总账户页签为「来源」多选（BOC/支付宝/微信）
  if (currentSource === TOTAL) {
    $("#category-list").innerHTML = ["boc", "alipay", "wechat"].map((s) =>
      `<label><input type="checkbox" value="${s}" ${f.sources.includes(s) ? "checked" : ""}> <span class="lbl">${esc(SOURCE_LABELS[s])}</span></label>`
    ).join("");
    $("#category-list").querySelectorAll("input").forEach((el) =>
      el.addEventListener("change", () => {
        f.sources = [...$("#category-list").querySelectorAll("input:checked")].map((i) => i.value);
        onFilterChange();
      }));
    $("#date-from").value = f.date_from;
    $("#date-to").value = f.date_to;
    $("#amount-min").value = f.amount_min;
    $("#amount-max").value = f.amount_max;
    updatePresetActive();
    return;
  }
  $("#category-list").innerHTML = o.categories.map((c) =>
    `<label><input type="checkbox" value="${esc(c)}" ${f.categories.includes(c) ? "checked" : ""}> <span class="lbl">${esc(c)}</span></label>`
  ).join("") || '<div style="font-size:12px;color:#C4C7CC">暂无分类数据</div>';
  $("#category-list").querySelectorAll("input").forEach((el) =>
    el.addEventListener("change", () => {
      f.categories = [...$("#category-list").querySelectorAll("input:checked")].map((i) => i.value);
      onFilterChange();
    }));
  // 日期与金额
  $("#date-from").value = f.date_from;
  $("#date-to").value = f.date_to;
  $("#amount-min").value = f.amount_min;
  $("#amount-max").value = f.amount_max;
  updatePresetActive();
}
function renderToolbar() {
  const o = optionsCache[currentSource];
  const vis = visibleColsBySource[currentSource];
  $("#search").placeholder = o.search_placeholder || "搜索…";
  $("#search").value = filtersBySource[currentSource].q;
  $("#total-tools").hidden = currentSource !== TOTAL;
  $("#colset-panel").innerHTML = o.columns.map((c) =>
    `<label><input type="checkbox" value="${esc(c.key)}" ${vis.has(c.key) ? "checked" : ""}> ${esc(c.label)}</label>`
  ).join("");
  $("#colset-panel").querySelectorAll("input").forEach((el) =>
    el.addEventListener("change", () => {
      if (el.checked) vis.add(el.value); else vis.delete(el.value);
      renderTableHead(); renderTableBodyKeep();
    }));
  $("#pagesize").value = String(pageSizeBySource[currentSource]);
  renderTableHead();
}
function renderTableHead() {
  const o = optionsCache[currentSource];
  const vis = visibleColsBySource[currentSource];
  const s = sortBySource[currentSource];
  const head = $("#table-head");
  head.innerHTML = o.columns.filter((c) => vis.has(c.key)).map((c) => {
    const sortable = c.sort ? " sortable" : "";
    let icon = "";
    if (c.sort && s.key === c.sort && s.order) icon = `<span class="sort-icon">${s.order === "desc" ? "▼" : "▲"}</span>`;
    return `<th class="${sortable}" data-sort="${c.sort || ""}">${esc(c.label)}${icon}</th>`;
  }).join("");
  head.querySelectorAll("th.sortable").forEach((th) =>
    th.addEventListener("click", () => cycleSort(th.dataset.sort)));
}
function cycleSort(sortKey) {
  const s = sortBySource[currentSource];
  if (s.key !== sortKey) { s.key = sortKey; s.order = "desc"; }
  else if (s.order === "desc") { s.order = "asc"; }
  else if (s.order === "asc") { s.order = null; }
  else { s.order = "desc"; }
  pageBySource[currentSource] = 1;
  renderTableHead();
  loadRows();
}
function renderCards(summary) {
  lastSummary = summary;
  if (currentSource === TOTAL) { renderTotalCards(summary); return; }
  const o = optionsCache[currentSource];
  const cards = [];
  cards.push({ cls: "income", title: "收入合计", value: "+" + fmtMoney(summary.income_sum), sub: "" });
  cards.push({ cls: "expense", title: "支出合计", value: "−" + fmtMoney(summary.expense_sum), sub: "" });
  if (o.neutral) {
    cards.push({ cls: "neutral", title: o.neutral, value: fmtMoney(summary.neutral_sum), sub: "不计入收支口径" });
  }
  if (summary.last_balance !== undefined) {
    cards.push({ cls: "", title: "期末余额", value: fmtMoney(summary.last_balance), sub: "筛选范围内最后一笔" });
  } else {
    cards.push({ cls: "", title: "笔数", value: summary.count.toLocaleString(), sub: "当前筛选结果" });
  }
  $("#cards").innerHTML = cards.map((c) =>
    `<div class="card ${c.cls}"><div class="card-title">${esc(c.title)}</div><div class="card-value">${c.value}</div>${c.sub ? `<div class="card-sub">${esc(c.sub)}</div>` : ""}</div>`
  ).join("");
}
function renderTotalCards(s) {
  // 真实口径：真实收入 / 真实支出 / 净收支 / 真实笔数（副文本 = 内部流动组数 · 行数）
  const net = s.net;
  const cards = [
    { cls: "income", title: "真实收入", value: "+" + fmtMoney(s.income.sum), sub: `${s.income.count.toLocaleString()} 笔` },
    { cls: "expense", title: "真实支出", value: "−" + fmtMoney(s.expense.sum), sub: `${s.expense.count.toLocaleString()} 笔` },
    { cls: "", title: "净收支", value: (net >= 0 ? "+" : "−") + fmtMoney(Math.abs(net)), sub: "真实收入 − 真实支出" },
    { cls: "", title: "真实笔数", value: s.count.toLocaleString(), sub: `内部流动 ${s.flow.groups.toLocaleString()} 组 · ${s.flow.rows.toLocaleString()} 行` },
  ];
  $("#cards").innerHTML = cards.map((c) =>
    `<div class="card ${c.cls}"><div class="card-title">${esc(c.title)}</div><div class="card-value">${c.value}</div>${c.sub ? `<div class="card-sub">${esc(c.sub)}</div>` : ""}</div>`
  ).join("");
}
function cellHtml(row, col) {
  const o = optionsCache[currentSource];
  const v = row[col.key];
  if (col.kind === "datetime") {
    let text = v || "";
    if (col.key === "datetime" && o.time_col) {
      text = [row[o.date_col], row[o.time_col]].filter(Boolean).join(" ");
    }
    if (!text) return '<span class="empty-val">—</span>';
    return esc(text);
  }

  });
  document.querySelectorAll("#presets .preset").forEach((b) => {
    const p = b.dataset.preset;
    const [from, to] = presetRange(p);
    const active = p === "custom"
      ? !matched && (f.date_from !== "" || f.date_to !== "")
      : from === f.date_from && to === f.date_to;
    b.classList.toggle("active", active);
  });
}
function presetRange(preset) {
  const now = new Date();
  const fmt = (d) => {
    const p2 = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  };
  const firstOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  if (preset === "this-month") return [fmt(firstOfMonth(now)), fmt(now)];
  if (preset === "last-month") {
    const m = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return [fmt(m), fmt(new Date(now.getFullYear(), now.getMonth(), 0))];
  }
  if (preset === "recent-3m") {
    const d = new Date(now.getFullYear(), now.getMonth() - 2, 1);
    return [fmt(d), fmt(now)];
  }
  return ["", ""];
}
function applyPreset(preset) {
  if (preset === "custom") {
    $("#date-from").focus();
    return;
  }
  const f = filtersBySource[currentSource];
  const [from, to] = presetRange(preset);
  f.date_from = from; f.date_to = to;
  $("#date-from").value = from; $("#date-to").value = to;
  updatePresetActive();
  onFilterChange();
}

/* ---- 从预设导入 ---- */
async function openPresetView() {
  presetChecked = new Set();
  presetExpanded = new Set();
  placeholderValues = {};
  try {
    const res = await api("/api/presets");
    if (!res.ok) { alert(res.error || "获取预设失败"); return; }
    presetsData = res.presets;
    renderPresetList();
  } catch (e) { alert("网络错误：" + e.message); }
}
function placeholderFields() {
  const keys = new Set();
  for (const pid of presetChecked) {
    const p = presetsData.find((x) => x.id === pid);
    if (!p) continue;
    for (const r of p.rules) {
      for (const c of r.conditions) {
        const matches = c.value.match(/\{[^{}]+\}/g);
        if (matches) matches.forEach((k) => keys.add(k));
      }
    }
  }
  return [...keys];
}
function renderPresetList() {
  const items = presetsData.map((p) => {
    const checked = presetChecked.has(p.id);
    const expanded = presetExpanded.has(p.id);
    const hit = p.hit_count == null ? "填写占位符后统计" : `预计命中 ${p.hit_count.toLocaleString()} 笔`;
    const rulesHtml = expanded ? `<div class="preset-rules">${p.rules.map((r) =>
      `<div class="preset-rule">${srcBadgeHtml(r.source)}<span>${esc(r.name)}</span>
       <span>${esc(conditionSummary(r.conditions))} · ${esc(ACTION_LABELS[r.action])}</span>
       ${r.enabled ? "" : '<span class="badge">默认不启用</span>'}</div>`).join("")}</div>` : "";
    return `<div class="preset-item" data-id="${p.id}">
      <div class="preset-head">
        <input type="checkbox" data-act="check" ${checked ? "checked" : ""}>
        <span class="preset-name">${esc(p.name)}</span>
        <span class="preset-meta">${p.rule_count} 条规则 · ${hit}</span>
        <button class="btn" data-act="expand" style="padding:2px 8px;font-size:12px">${expanded ? "收起" : "查看规则"}</button>
      </div>
      <div class="preset-desc">${esc(p.description)}</div>
      ${rulesHtml}
    </div>`;
  }).join("");
  const placeholderInputs = placeholderFields().map((key) => `
    <div class="f-row"><span class="f-label">${esc(key.slice(1, -1))}</span>
      <input class="txt" data-ph="${esc(key)}" value="${esc((placeholderValues[key] || ""))}" placeholder="用于规则条件中的占位符 ${esc(key)}"></div>`).join("");
  $("#rules-modal-body").innerHTML = `
    <div class="rules-toolbar"><button class="btn" id="btn-preset-back">← 返回规则列表</button></div>
    <div id="preset-list">${items}</div>
    ${placeholderInputs ? `<div class="rule-group"><h4>占位符填写</h4>${placeholderInputs}</div>` : ""}
    <div class="form-actions">
      <button class="btn btn-primary" id="btn-preset-import" ${presetChecked.size ? "" : "disabled"}>导入所选预设</button>
    </div>`;
  $("#btn-preset-back").addEventListener("click", () => loadRulesView());
  document.querySelectorAll("#preset-list .preset-item").forEach((item) => {
    const pid = item.dataset.id;
    item.querySelector('[data-act="check"]').addEventListener("change", (e) => {
      e.target.checked ? presetChecked.add(pid) : presetChecked.delete(pid);
      renderPresetList();  // 占位符填写区随勾选变化
    });
    item.querySelector('[data-act="expand"]').addEventListener("click", () => {
      presetExpanded.has(pid) ? presetExpanded.delete(pid) : presetExpanded.add(pid);
      renderPresetList();
    });
  });
  document.querySelectorAll("#rules-modal-body input[data-ph]").forEach((el) =>
    el.addEventListener("input", (e) => { placeholderValues[e.target.dataset.ph] = e.target.value; }));
  $("#btn-preset-import").addEventListener("click", submitPresetImport);
}
async function submitPresetImport() {
  const keys = placeholderFields();
  const replacements = {};
  for (const key of keys) {
    const value = (placeholderValues[key] || "").trim();
    if (!value) { alert(`请填写占位符「${key}」对应的内容`); return; }
    replacements[key.slice(1, -1)] = value;
  }
  const res = await api("/api/rules/import", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ preset_ids: [...presetChecked], replacements }),
  });
  if (!res.ok) { alert(res.error || "导入失败"); return; }
  const skipped = res.skipped || [];
  const message = `已导入 ${res.created.length} 条规则，生成可编辑副本`
    + (skipped.length ? `，跳过 ${skipped.length} 条（同名同条件已存在）` : "");
  await refreshAfterRuleChange();
  showRulesBanner(message, skipped.length ? "warn" : "success");
}

function renderModalSelect() {
  const body = $("#modal-body");
  body.innerHTML = `
    <div id="dropzone">
      <div class="dz-title">点击选择或拖拽文件到此处（可多选）</div>
      <div>支持格式：${esc(FORMAT_DESC[modalSource])}</div>
      <div class="dz-desc">导入前会先解析预览并做去重比对，确认后才写入数据库</div>
    </div>
    <input type="file" id="file-input" accept="${ACCEPT[modalSource]}" multiple hidden>`;
  const dz = $("#dropzone");
  const input = $("#file-input");
  dz.addEventListener("click", () => input.click());
  input.addEventListener("change", () => { if (input.files.length) handleFiles([...input.files]); });
  ["dragover", "dragenter"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("dragover"); }));
  dz.addEventListener("drop", (e) => {
    const files = e.dataTransfer.files && [...e.dataTransfer.files];
    if (files && files.length) handleFiles(files);
  });
}
function handleFiles(files) {
  // 同一次选择中同名文件忽略并提示（设计 §3.3 建议项）；按当前 Tab 限定类型，不匹配的明确提示且不写入
  const seenNames = new Set();
  const dupNames = [];
  const unique = files.filter((f) => {
    if (seenNames.has(f.name)) { dupNames.push(f.name); return false; }
    seenNames.add(f.name);
    return true;
  });
  const valid = unique.filter((f) => extOk(f.name));
  const invalid = unique.filter((f) => !extOk(f.name));
  const notices = [];
  if (invalid.length) notices.push(`以下 ${invalid.length} 个文件类型与当前数据源不符，已跳过不导入：${invalid.map((f) => f.name).join("、")}`);
  if (dupNames.length) notices.push(`同一次选择中的 ${dupNames.length} 个同名文件已忽略：${dupNames.join("、")}`);
  modalWarn = notices.length ? notices.join("；") : null;
  if (!valid.length) {
    renderModalSelect();
    modalError(modalWarn);
    return;
  }
  if (valid.length === 1) {
    handleFile(valid[0]);
    return;
  }
  modalFiles = valid;
  previewBatch(valid);
}
function modalError(msg) {
  let el = $("#modal-error");
  if (!el) { el = document.createElement("div"); el.id = "modal-error"; $("#modal-body").prepend(el); }
  el.textContent = msg;
  el.style.display = "block";
}
async function handleFile(file) {
  modalFile = file;
  renderModalLoading(`正在解析 ${file.name} …`);
  try {
    const res = await upload("/api/import/preview", file);
    if (!res.ok) { renderModalSelect(); modalError(res.error || "解析失败"); return; }
    renderModalPreview(res);
  } catch (e) {
    renderModalSelect();
    modalError("网络错误：" + e.message);
  }
}
function upload(path, file) {
  return fetch(path, {
    method: "POST",
    body: file,
    headers: {
      "Content-Type": "application/octet-stream",
      "X-Source": modalSource,
      "X-Filename": encodeURIComponent(file.name),
    },
  }).then((r) => r.json().catch(() => ({ ok: false, error: "响应解析失败" })));
}
function uploadBatch(path, files) {
  const fd = new FormData();
  for (const f of files) fd.append("files", f, f.name);
  return fetch(path, {
    method: "POST",
    body: fd,
    headers: { "X-Source": modalSource },  // Content-Type 由浏览器带 boundary 自动设置
  }).then((r) => r.json().catch(() => ({ ok: false, error: "响应解析失败" })));
}
async function previewBatch(files) {
  renderModalLoading(`正在解析 ${files.length} 个文件 …`);
  try {
    const res = await uploadBatch("/api/import/preview-batch", files);
    if (!res.ok) { renderModalSelect(); modalError(res.error || "解析失败"); return; }
    // 响应文件顺序与上传顺序一致；解析失败的文件确认时不再上传，结果中直接标记失败
    renderBatchPreview(buildBatchModel(res, files));
  } catch (e) {
    renderModalSelect();
    modalError("网络错误：" + e.message);
  }
}
function renderModalLoading(text) {
  $("#modal-body").innerHTML = `
    <div style="padding:20px;text-align:center;color:#646A73">${esc(text)}</div>
    <div class="progress-bar"><div class="fill"></div></div>`;
}
function renderModalPreview(p) {
  const dist = p.distribution.map((d) =>
    `<div class="stat"><div class="s-label">${esc(d.label)}</div><div class="s-value">${d.count.toLocaleString()} 笔 · ${fmtMoney(d.sum)}</div></div>`).join("");
  const sampleHead = p.columns.map((c) => `<th>${esc(c)}</th>`).join("");
  const sampleRows = p.sample.map((r) => `<tr>${r.map((v) => `<td>${v ? esc(v) : "—"}</td>`).join("")}</tr>`).join("");
  const warn = modalWarn ? `<div class="modal-warn">${esc(modalWarn)}</div>` : "";
  $("#modal-body").innerHTML = `
    ${warn}
    <div class="preview-file">${esc(p.file_name)}</div>
    <div class="preview-block">
      <h4>解析结果</h4>
      <div class="preview-stats">
        <div class="stat"><div class="s-label">明细行数</div><div class="s-value">${p.row_count.toLocaleString()}</div></div>
        <div class="stat"><div class="s-label">日期范围</div><div class="s-value" style="font-size:13px">${esc(p.date_min || "—")} ~ ${esc(p.date_max || "—")}</div></div>
        ${dist}
      </div>
    </div>
    <div class="preview-block">
      <h4>去重比对</h4>
      <div class="preview-stats">
        <div class="stat new"><div class="s-label">新增</div><div class="s-value">${p.new_count.toLocaleString()} 条</div></div>
        <div class="stat dup"><div class="s-label">重复跳过</div><div class="s-value">${p.dup_count.toLocaleString()} 条</div></div>
        ${p.error_count ? `<div class="stat err"><div class="s-label">解析异常</div><div class="s-value">${p.error_count} 行</div></div>` : ""}
      </div>
    </div>
    <div class="preview-block">
      <h4>首 5 行样例（确认列未错位）</h4>
      <div class="sample-table-wrap"><table><thead><tr>${sampleHead}</tr></thead><tbody>${sampleRows}</tbody></table></div>
    </div>
    <div id="modal-actions">
      <button class="btn" id="btn-reselect">重新选择</button>
      <button class="btn" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-confirm" ${p.new_count === 0 && p.error_count === 0 ? "disabled" : ""}>确认导入${p.new_count ? `（${p.new_count} 条）` : ""}</button>
    </div>`;
  $("#btn-reselect").addEventListener("click", () => { modalFile = null; modalWarn = null; renderModalSelect(); });
  $("#btn-cancel").addEventListener("click", closeModal);
  $("#btn-confirm").addEventListener("click", confirmImport);
}
async function confirmImport() {
  if (!modalFile) return;
  renderModalLoading(`正在写入 SQLite …`);
  try {
    const res = await upload("/api/import/confirm", modalFile);
    if (!res.ok) { renderModalSelect(); modalError(res.error || "导入失败"); return; }
    closeModal();
    const msg = `已导入 ${res.inserted.toLocaleString()} 条，跳过 ${res.skipped.toLocaleString()} 条，失败 ${res.failed} 条`;
    addBanner(res.failed > 0 ? "error" : "success", msg, res.failures);
    await refreshAll();
  } catch (e) {
    renderModalSelect();
    modalError("网络错误：" + e.message);
  }
}

/* ---- 批量导入：预览 → 逐文件写入（进度）→ 结果 ---- */
function buildBatchModel(res, files) {
  // 服务端逐文件响应 → 客户端模型：columns 顶层共享，卡片展开态随模型保存
  return {
    source: res.source,
    columns: res.columns || [],
    expanded: new Set(res.files.length === 1 ? [res.files[0].file_name] : []),  // 单文件默认展开
    items: res.files.map((f, i) => ({
      file: files[i],
      name: f.file_name,
      error: f.error || null,
      removed: false,
      stats: f.error ? null : {
        row_count: f.row_count,
        error_count: f.error_count,
        invalid_count: f.invalid_count,
        new_count: f.new_count,
        dup_count: f.dup_count,
        date_min: f.date_min,
        date_max: f.date_max,
        distribution: f.distribution || [],
        sample: f.sample || [],
      },
    })),
  };
}
function batchTotals(model) {
  // 移除后合并统计即时重算：仅统计未移除且解析成功的文件
  const active = model.items.filter((f) => !f.removed && !f.error);
  const totals = {
    active_count: model.items.filter((f) => !f.removed).length,
    row_count: 0, new_count: 0, dup_count: 0, failed_count: 0,
    date_min: "", date_max: "", distribution: [],
  };
  const distAcc = {};
  const order = [];
  for (const f of active) {
    const s = f.stats;
    totals.row_count += s.row_count;
    totals.new_count += s.new_count;
    totals.dup_count += s.dup_count;
    totals.failed_count += s.error_count + s.invalid_count;
    if (s.date_min && (!totals.date_min || s.date_min < totals.date_min)) totals.date_min = s.date_min;
    if (s.date_max && (!totals.date_max || s.date_max > totals.date_max)) totals.date_max = s.date_max;
    for (const d of s.distribution) {
      if (!order.includes(d.label)) order.push(d.label);
      const acc = distAcc[d.label] || (distAcc[d.label] = { count: 0, sum: 0 });
      acc.count += d.count;
      acc.sum += d.sum;
    }
  }
  totals.distribution = order.map((l) => ({ label: l, count: distAcc[l].count, sum: Math.round(distAcc[l].sum * 100) / 100 }));
  return totals;
}
function batchFileCardHtml(model, f, i) {
  if (f.error) {
    return `<div class="file-card error" data-i="${i}">
      <div class="file-card-head">
        <span class="fc-toggle">·</span>
        <span class="fc-name">${esc(f.name)}</span>
        <span class="fc-summary">解析失败：${esc(f.error)}</span>
        <button class="fc-remove">移除</button>
      </div>
    </div>`;
  }
  const s = f.stats;
  const failed = s.error_count + s.invalid_count;
  const isOpen = model.expanded.has(f.name);
  const dist = s.distribution.map((d) =>
    `<div class="stat"><div class="s-label">${esc(d.label)}</div><div class="s-value">${d.count.toLocaleString()} 笔 · ${fmtMoney(d.sum)}</div></div>`).join("");
  const sampleHead = model.columns.map((c) => `<th>${esc(c)}</th>`).join("");
  const sampleRows = s.sample.map((r) => `<tr>${r.map((v) => `<td>${v ? esc(v) : "—"}</td>`).join("")}</tr>`).join("");
  return `<div class="file-card${isOpen ? " open" : ""}" data-i="${i}">
    <div class="file-card-head">
      <span class="fc-toggle">${isOpen ? "▾" : "▸"}</span>
      <span class="fc-name">${esc(f.name)}</span>
      <span class="fc-summary">${s.row_count.toLocaleString()} 行 · <span class="bf-new">新增 ${s.new_count.toLocaleString()}</span> · 重复 ${s.dup_count.toLocaleString()}${failed ? ` · <span class="bf-fail">失败 ${failed}</span>` : ""}</span>
      <button class="fc-remove">移除</button>
    </div>
    <div class="file-card-body" ${isOpen ? "" : "hidden"}>
      <h5>收支分布</h5>
      <div class="preview-stats">${dist}</div>
      <h5>首 5 行样例</h5>
      <div class="sample-table-wrap"><table><thead><tr>${sampleHead}</tr></thead><tbody>${sampleRows}</tbody></table></div>
    </div>
  </div>`;
}
function renderBatchPreview(model) {
  const totals = batchTotals(model);
  const warn = modalWarn ? `<div class="modal-warn">${esc(modalWarn)}</div>` : "";
  const errorFiles = model.items.filter((f) => f.error && !f.removed);
  const errNote = errorFiles.length
    ? `<div class="modal-warn">${errorFiles.length} 个文件解析失败或类型不符，确认后不会写入，请检查文件或移除</div>` : "";
  const cards = model.items.map((f, i) => (f.removed ? "" : batchFileCardHtml(model, f, i))).join("");
  const canConfirm = totals.new_count > 0 || totals.failed_count > 0;
  const extra = [];
  if (totals.date_min) extra.push(`覆盖日期 ${esc(totals.date_min)} ~ ${esc(totals.date_max)}`);
  const distLine = totals.distribution.map((d) => `${esc(d.label)} ${d.count.toLocaleString()} 笔 · ${fmtMoney(d.sum)}`).join(" ｜ ");
  if (distLine) extra.push(distLine);
  $("#modal-body").innerHTML = `
    ${warn}${errNote}
    <div class="preview-file">已选择 ${totals.active_count} 个文件（${esc(SOURCE_LABELS[modalSource])}）</div>
    <div class="preview-block">
      <h4>逐文件明细（点击展开收支分布与首 5 行样例，可移除）</h4>
      ${cards}
    </div>
    <div class="preview-block">
      <h4>合并统计</h4>
      <div class="preview-stats">
        <div class="stat new"><div class="s-label">新增</div><div class="s-value">${totals.new_count.toLocaleString()} 条</div></div>
        <div class="stat dup"><div class="s-label">重复跳过</div><div class="s-value">${totals.dup_count.toLocaleString()} 条</div></div>
        <div class="stat err"><div class="s-label">失败（不写入）</div><div class="s-value">${totals.failed_count.toLocaleString()} 行</div></div>
        <div class="stat"><div class="s-label">明细总行数</div><div class="s-value">${totals.row_count.toLocaleString()}</div></div>
      </div>
      <div class="batch-merged-extra">${extra.join(" · ")}</div>
    </div>
    <div id="modal-actions">
      <button class="btn" id="btn-reselect">重新选择</button>
      <button class="btn" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-confirm" ${canConfirm ? "" : "disabled"}>确认导入${totals.new_count ? `（${totals.new_count.toLocaleString()} 条）` : ""}</button>
    </div>`;
  // 卡片事件：展开/收起、移除（移除后合并统计即时重算）
  document.querySelectorAll("#modal-body .file-card").forEach((card) => {
    const item = model.items[Number(card.dataset.i)];
    card.querySelector(".file-card-head").addEventListener("click", () => {
      if (model.expanded.has(item.name)) model.expanded.delete(item.name);
      else model.expanded.add(item.name);
      renderBatchPreview(model);
    });
    card.querySelector(".fc-remove").addEventListener("click", (event) => {
      event.stopPropagation();  // 防冒泡到卡片头部展开处理器，覆盖「回到选择态」的渲染
      item.removed = true;
      model.expanded.delete(item.name);
      if (!model.items.some((f) => !f.removed)) {
        modalWarn = null;
        renderModalSelect();
        return;
      }
      renderBatchPreview(model);
    });
  });
  $("#btn-reselect").addEventListener("click", () => { modalWarn = null; renderModalSelect(); });
  $("#btn-cancel").addEventListener("click", closeModal);
  $("#btn-confirm").addEventListener("click", () => confirmBatchImport(model));
}
async function confirmBatchImport(model) {
  // 逐文件调用单文件 confirm 接口（幂等键不变，批内重复由库内已见键自然拦截）；
  // 已移除与预览解析失败的文件不上传（解析失败的直接在结果中标记）
  const plan = model.items.filter((f) => !f.removed).map((f) => ({ file: f.file, error: f.error || null }));
  batchImporting = true;
  renderBatchProgress(plan);
  const results = [];
  for (let i = 0; i < plan.length; i++) {
    const { file, error } = plan[i];
    if (error) {
      results.push({ file_name: file.name, error, inserted: 0, skipped: 0, failed: 0, failures: [] });
      setBatchItemState(i, "fail", `解析失败：${error}`);
    } else {
      setBatchItemState(i, "active", "写入中…");
      try {
        const res = await upload("/api/import/confirm", file);
        if (!res.ok) {
          results.push({ file_name: file.name, error: res.error || "导入失败", inserted: 0, skipped: 0, failed: 0, failures: [] });
          setBatchItemState(i, "fail", res.error || "导入失败");
        } else {
          results.push({ file_name: file.name, error: null, ...res });
          setBatchItemState(i, "done", `新增 ${res.inserted.toLocaleString()} · 跳过 ${res.skipped.toLocaleString()} · 失败 ${res.failed}`);
        }
      } catch (e) {
        results.push({ file_name: file.name, error: "网络错误：" + e.message, inserted: 0, skipped: 0, failed: 0, failures: [] });
        setBatchItemState(i, "fail", "网络错误：" + e.message);
      }
    }
    setBatchProgress(i + 1, plan.length);
  }
  batchImporting = false;
  renderBatchDone(results);
}
function renderBatchProgress(plan) {
  $("#modal-body").innerHTML = `
    <div class="preview-file">正在导入（0/${plan.length}）</div>
    <div class="batch-file-list">${plan.map((p, i) => `
      <div class="batch-file-item" data-i="${i}">
        <span class="bf-name">${esc(p.file.name)}</span>
        <span class="bf-status">等待中</span>
      </div>`).join("")}</div>
    <div class="progress-bar"><div class="fill determinate" id="batch-progress-fill"></div></div>
    <div style="font-size:12px;color:#646A73;margin-top:8px">请勿关闭窗口，正在逐文件写入</div>`;
}
function setBatchItemState(i, state, text) {
  const el = document.querySelector(`.batch-file-item[data-i="${i}"]`);
  if (!el) return;
  el.className = `batch-file-item ${state}`;
  el.querySelector(".bf-status").textContent = text;
}
function setBatchProgress(done, total) {
  const fill = $("#batch-progress-fill");
  if (fill) fill.style.width = `${Math.round((done / total) * 100)}%`;
  const title = $("#modal-body .preview-file");
  if (title) title.textContent = `正在导入（${done}/${total}）`;
}
function renderBatchDone(results) {
  const agg = results.reduce((a, r) => ({
    inserted: a.inserted + (r.inserted || 0),
    skipped: a.skipped + (r.skipped || 0),
    failed: a.failed + (r.failed || 0),
    fileErrors: a.fileErrors + (r.error ? 1 : 0),
  }), { inserted: 0, skipped: 0, failed: 0, fileErrors: 0 });
  const rows = results.map((r) => {
    if (r.error) return `<tr class="bf-error"><td>${esc(r.file_name)}</td><td>导入失败：${esc(r.error)}</td></tr>`;
    return `<tr><td>${esc(r.file_name)}</td><td class="num">新增 <span class="bf-new">${r.inserted.toLocaleString()}</span> · 跳过 ${r.skipped.toLocaleString()}${r.failed ? ` · <span class="bf-fail">失败 ${r.failed}</span>` : ""}</td></tr>`;
  }).join("");
  $("#modal-body").innerHTML = `
    <div class="preview-file">导入完成</div>
    <div class="preview-block">
      <h4>逐文件结果</h4>
      <div class="sample-table-wrap"><table class="batch-table">
        <thead><tr><th>文件</th><th>结果</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="preview-block">
      <h4>合并结果</h4>
      <div class="preview-stats">
        <div class="stat new"><div class="s-label">新增</div><div class="s-value">${agg.inserted.toLocaleString()} 条</div></div>
        <div class="stat dup"><div class="s-label">重复跳过</div><div class="s-value">${agg.skipped.toLocaleString()} 条</div></div>
        <div class="stat err"><div class="s-label">失败行数</div><div class="s-value">${agg.failed.toLocaleString()}</div></div>
      </div>
    </div>
    <div id="modal-actions">
      <button class="btn btn-primary" id="btn-done">完成</button>
    </div>`;
  $("#btn-done").addEventListener("click", () => {
    closeModal();
    const fileErrNote = agg.fileErrors ? `（${agg.fileErrors} 个文件解析失败）` : "";
    const msg = `已导入 ${agg.inserted.toLocaleString()} 条，跳过 ${agg.skipped.toLocaleString()} 条，失败 ${agg.failed} 条${fileErrNote}`;
    const failures = results.flatMap((r) => (r.failures || []).map((f) => ({ ...f, file: r.file_name })));
    addBanner(agg.failed > 0 || agg.fileErrors > 0 ? "error" : "success", msg, failures);
    refreshAll();
  });
}

$("#btn-import-empty").addEventListener("click", openModal);

$("#btn-reset").addEventListener("click", resetFilters);

/* ================= 启动 ================= */
(async function init() {
  try {
    await loadMeta();
    await loadOptions(currentSource, false);
    renderTabs(); renderSidebar(); renderToolbar();
    await Promise.all([loadRows(), loadSummary()]);
  } catch (e) {
    showErrorBanner(e.message);
    renderTabs();
  }
})();
</script>
