[project]
name = "paycheck-backend"
version = "1.0.1"
description = "PayCheck backend - Django + DRF + ThreadPoolExecutor"
requires-python = ">=3.10, <3.14"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.0,<5.0",
    "django-filter>=24.0,<25.0",
    "openpyxl>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.6.0",
    "paddlepaddle>=2.6.0",
    "PyMuPDF>=1.23.0",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "tqdm>=4.60.0",
]
dev = [
    "django-extensions>=3.2,<4.0",
]

[tool.uv]
package = false
