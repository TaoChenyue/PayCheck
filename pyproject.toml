[project]
name = "paycheck"
version = "1.0.1"
description = "个人账单统计工具 — Django + React 前后端分离"
requires-python = ">=3.10, <3.14"
dependencies = [
    "opencv-python",
    "openpyxl",
    "paddleocr",
    "Pillow",
    "PyMuPDF",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
# CPU 用户: uv sync --extra cpu
cpu = ["paddlepaddle>=2.6.0"]
# GPU 用户 (CUDA 12.6): uv sync --extra gpu
gpu = ["paddlepaddle-gpu>=2.6.0"]


[tool.uv]
package = false

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-gpu" }
